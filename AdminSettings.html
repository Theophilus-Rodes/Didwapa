<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA Admin - Settings</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
:root{--dark:#06152f;--green:#20c463;--orange:#ff6600;--bg:#f4f7fb;--muted:#6b7280;--border:#e5e7eb;--red:#dc2626}
body{background:var(--bg);color:var(--dark)}
.page{width:min(1180px,96%);margin:auto;padding:22px 0}
.top{background:white;border-radius:24px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 38px rgba(6,21,47,.08);margin-bottom:18px;animation:down .5s ease}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.logo{width:42px;height:42px;border-radius:15px;background:var(--dark);color:var(--green);display:grid;place-items:center;font-weight:900}
.back{background:var(--dark);color:white;text-decoration:none;padding:11px 15px;border-radius:14px;font-weight:900}
.header{background:linear-gradient(135deg,var(--dark),#0b244d);color:white;padding:30px;border-radius:28px;margin-bottom:18px;animation:up .6s ease}
.header h1{font-size:2.2rem;margin-bottom:8px}
.header p{color:#cbd5e1;line-height:1.6}
.controls{background:white;border-radius:22px;padding:14px;display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:16px;box-shadow:0 12px 26px rgba(6,21,47,.06);animation:up .65s ease}
input,select{height:46px;border:1px solid var(--border);border-radius:15px;padding:0 13px;background:#f8fafc;outline:none}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(32,196,99,.12)}
.list{display:grid;gap:14px}
.card{background:white;border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:0 14px 30px rgba(6,21,47,.07);animation:up .6s ease;transition:.25s}
.card:hover{transform:translateY(-4px)}
.vendor-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:15px}
.vendor-top h3{font-size:1.05rem;margin-bottom:5px}
.vendor-top p{font-size:.82rem;color:var(--muted);margin:3px 0}
.badge{padding:7px 11px;border-radius:999px;font-size:.75rem;font-weight:900;background:#d1fae5;color:#047857}
.disabled-badge{background:#fee2e2;color:#b91c1c}
.permissions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.check{border:1px solid var(--border);background:#f8fafc;border-radius:16px;padding:12px;display:flex;align-items:center;gap:9px;font-size:.85rem;font-weight:800;cursor:pointer}
.check input{width:18px;height:18px}
.actions{display:flex;gap:10px;margin-top:16px}
.save{height:48px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--green),#047857);color:white;font-weight:900;padding:0 18px;cursor:pointer;flex:1}
.disable{height:48px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--red),#991b1b);color:white;font-weight:900;padding:0 18px;cursor:pointer;flex:1}
.empty{background:white;border-radius:22px;padding:28px;text-align:center;color:var(--muted)}
.alert{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:white;padding:15px 20px;border-radius:15px;box-shadow:0 15px 40px rgba(0,0,0,.2);display:none;font-weight:900;z-index:9999}
.success{color:green}.error{color:red}
@keyframes down{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:850px){.controls{grid-template-columns:1fr}.permissions{grid-template-columns:1fr 1fr}.vendor-top{flex-direction:column}.actions{flex-direction:column}}
@media(max-width:480px){.page{width:100%;padding:10px}.top,.header,.card{border-radius:20px}.header h1{font-size:1.45rem}.permissions{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="alert" id="alertBox"></div>

<div class="page">
  <div class="top">
    <div class="brand"><div class="logo">DW</div> Admin Settings</div>
    <a href="admin.html" class="back">← Dashboard</a>
  </div>

  <div class="header">
    <h1>Vendor Role Settings</h1>
    <p>Assign vendor permissions, give multiple tasks, allow full access, or disable access completely.</p>
  </div>

  <div class="controls">
    <input id="searchInput" placeholder="Search vendor name, phone, email..." oninput="filterVendors()">
    <select id="accessFilter" onchange="filterVendors()">
      <option value="">All Vendors</option>
      <option value="active">Has Access</option>
      <option value="disabled">Disabled</option>
      <option value="all">All Access</option>
    </select>
  </div>

  <div class="list" id="vendorsBox">
    <div class="empty">Loading vendors...</div>
  </div>
</div>

<script>
const API_BASE = `http://${window.location.hostname}:5000`;
let vendors = [];

const alertBox = document.getElementById("alertBox");

function showAlert(message,type="success"){
  alertBox.textContent = message;
  alertBox.className = `alert ${type}`;
  alertBox.style.display = "block";
  setTimeout(()=>alertBox.style.display="none",2500);
}

async function loadVendors(){
  try{
    const res = await fetch(`${API_BASE}/api/admin/vendor-permissions`, {
      credentials:"include"
    });

    const data = await res.json();

    if(!data.success){
      document.getElementById("vendorsBox").innerHTML = `<div class="empty">${data.message}</div>`;
      return;
    }

    vendors = data.vendors || [];
    renderVendors(vendors);

  }catch(error){
    console.error(error);
    document.getElementById("vendorsBox").innerHTML = `<div class="empty">Failed to load vendors.</div>`;
  }
}

function checked(value){
  return Number(value) === 1 ? "checked" : "";
}

function renderVendors(list){
  const box = document.getElementById("vendorsBox");

  if(list.length === 0){
    box.innerHTML = `<div class="empty">No vendors found.</div>`;
    return;
  }

  box.innerHTML = list.map(v => {
    const disabled = Number(v.access_disabled) === 1;
    const allAccess = Number(v.all_access) === 1;

    return `
      <div class="card" id="vendorCard${v.id}">
        <div class="vendor-top">
          <div>
            <h3>${v.firstname || ""} ${v.lastname || ""}</h3>
            <p><strong>ID:</strong> ${v.id}</p>
            <p><strong>Email:</strong> ${v.email || "N/A"}</p>
            <p><strong>Phone:</strong> ${v.telephone || "N/A"}</p>
          </div>

          <span class="badge ${disabled ? "disabled-badge" : ""}">
            ${disabled ? "Access Disabled" : allAccess ? "All Access" : "Custom Access"}
          </span>
        </div>

       <div class="permissions">
  <label class="check"><input type="checkbox" id="verify_vendor_${v.id}" ${checked(v.verify_vendor)}> Verify Vendor</label>
  <label class="check"><input type="checkbox" id="verify_products_${v.id}" ${checked(v.verify_products)}> Verify Products</label>
  <label class="check"><input type="checkbox" id="resolve_disputes_${v.id}" ${checked(v.resolve_disputes)}> Check & Resolve Disputes</label>
  <label class="check"><input type="checkbox" id="message_response_${v.id}" ${checked(v.message_response)}> Message Response</label>
  <label class="check"><input type="checkbox" id="check_transactions_${v.id}" ${checked(v.check_transactions)}> Check All Transactions</label>
  <label class="check"><input type="checkbox" id="all_access_${v.id}" ${checked(v.all_access)} onchange="toggleAllAccess(${v.id})"> Allow All Access</label>
  <label class="check"><input type="checkbox" id="normal_control_${v.id}" ${checked(v.normal_control)} onchange="toggleNormalControl(${v.id})"> Normal Control</label>
  <label class="check"><input type="checkbox" id="access_disabled_${v.id}" ${checked(v.access_disabled)} onchange="toggleDisabled(${v.id})"> Disable Access Totally</label>
</div>

        <div class="actions">
          <button class="save" onclick="savePermissions(${v.id})">Save Permissions</button>
          <button class="disable" onclick="disableAccess(${v.id})">Disable Access</button>
        </div>
      </div>
    `;
  }).join("");
}

function toggleAllAccess(id){
  const all = document.getElementById(`all_access_${id}`).checked;

  if(all){
    document.getElementById(`access_disabled_${id}`).checked = false;
    document.getElementById(`normal_control_${id}`).checked = false;

    ["verify_vendor","verify_products","resolve_disputes","message_response","check_transactions"].forEach(key=>{
      document.getElementById(`${key}_${id}`).checked = true;
    });
  }
}

function toggleDisabled(id){
  const disabled = document.getElementById(`access_disabled_${id}`).checked;

  if(disabled){
    ["verify_vendor","verify_products","resolve_disputes","message_response","check_transactions","all_access","normal_control"].forEach(key=>{
      document.getElementById(`${key}_${id}`).checked = false;
    });
  }
}

async function savePermissions(id){
  const payload = {
    vendor_id:id,
    verify_vendor:document.getElementById(`verify_vendor_${id}`).checked ? 1 : 0,
    verify_products:document.getElementById(`verify_products_${id}`).checked ? 1 : 0,
    resolve_disputes:document.getElementById(`resolve_disputes_${id}`).checked ? 1 : 0,
    message_response:document.getElementById(`message_response_${id}`).checked ? 1 : 0,
    check_transactions:document.getElementById(`check_transactions_${id}`).checked ? 1 : 0,
    all_access:document.getElementById(`all_access_${id}`).checked ? 1 : 0,
    access_disabled:document.getElementById(`access_disabled_${id}`).checked ? 1 : 0,
    normal_control: document.getElementById(`normal_control_${id}`).checked ? 1 : 0,
  };

  try{
    const res = await fetch(`${API_BASE}/api/admin/vendor-permissions/save`, {
      method:"POST",
      credentials:"include",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data = await res.json();
    showAlert(data.message, data.success ? "success" : "error");

    if(data.success) loadVendors();

  }catch(error){
    console.error(error);
    showAlert("Failed to save permissions.","error");
  }
}

function disableAccess(id){
  if(!confirm("Disable all access for this vendor?")) return;

  ["verify_vendor","verify_products","resolve_disputes","message_response","check_transactions","all_access","normal_control"].forEach(key=>{
    document.getElementById(`${key}_${id}`).checked = false;
  });

  document.getElementById(`access_disabled_${id}`).checked = true;
  savePermissions(id);
}

function toggleNormalControl(id) {
  const normal = document.getElementById(`normal_control_${id}`).checked;

  if (normal) {
    document.getElementById(`all_access_${id}`).checked = false;
    document.getElementById(`access_disabled_${id}`).checked = false;

    document.getElementById(`verify_vendor_${id}`).checked = false;
    document.getElementById(`verify_products_${id}`).checked = false;
    document.getElementById(`resolve_disputes_${id}`).checked = false;
    document.getElementById(`message_response_${id}`).checked = false;
    document.getElementById(`check_transactions_${id}`).checked = false;
  }
}

function filterVendors(){
  const key = document.getElementById("searchInput").value.toLowerCase();
  const filter = document.getElementById("accessFilter").value;

  const filtered = vendors.filter(v => {
    const text = `
      ${v.firstname || ""}
      ${v.lastname || ""}
      ${v.email || ""}
      ${v.telephone || ""}
    `.toLowerCase();

    const matchesText = text.includes(key);

    if(filter === "disabled") return matchesText && Number(v.access_disabled) === 1;
    if(filter === "all") return matchesText && Number(v.all_access) === 1;
    if(filter === "active") return matchesText && Number(v.access_disabled) !== 1;

    return matchesText;
  });

  renderVendors(filtered);
}

loadVendors();
</script>

</body>
</html>
