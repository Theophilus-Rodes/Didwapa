<!DOCTYPE html>

<title>DIDWAPA FAQ & Policies</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

:root{
--primary:#ff6600;
--green:#16a34a;
--bg:#f7f8fb;
--text:#111827;
--muted:#6b7280;
--border:#e5e7eb;
--soft:#fff4ea;
}

body{
background:var(--bg);
color:var(--text);
padding-bottom:90px;
}

.app{
max-width:480px;
margin:auto;
background:#fff;
min-height:100vh;
}

.header{
position:sticky;
top:0;
z-index:20;
background:#fff;
padding:14px;
border-bottom:1px solid var(--border);
box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.top-row{
display:flex;
align-items:center;
gap:12px;
margin-bottom:12px;
}

.back{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:var(--soft);
color:var(--primary);
font-size:22px;
cursor:pointer;
font-weight:bold;
}

.title-box{
flex:1;
}

.title-box small{
color:var(--muted);
font-weight:bold;
}

.title-box h2{
margin-top:3px;
font-size:28px;
}

.search-box{
height:46px;
display:flex;
align-items:center;
gap:8px;
background:#fafafa;
border:1px solid var(--border);
border-radius:14px;
padding:0 12px;
}

.search-box input{
width:100%;
border:none;
outline:none;
background:transparent;
font-size:15px;
}

.policy-list{
padding:15px;
display:flex;
flex-direction:column;
gap:12px;
}

.policy-card{
display:flex;
align-items:center;
gap:14px;
padding:15px;
background:#fff;
border:1px solid var(--border);
border-radius:18px;
cursor:pointer;
transition:.25s;
box-shadow:0 6px 15px rgba(0,0,0,.04);
}

.policy-card:hover{
transform:translateY(-2px);
}

.icon{
width:52px;
height:52px;
border-radius:16px;
background:var(--soft);
display:grid;
place-items:center;
font-size:24px;
flex-shrink:0;
}

.info{
flex:1;
}

.info strong{
display:block;
font-size:15px;
margin-bottom:4px;
}

.info small{
color:var(--muted);
font-size:13px;
}

.arrow{
font-size:24px;
color:var(--primary);
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
max-width:480px;
width:100%;
display:grid;
grid-template-columns:repeat(5,1fr);
background:#fff;
border-top:1px solid var(--border);
padding:8px 5px;
}

.nav-item{
text-align:center;
text-decoration:none;
color:#111;
font-size:12px;
font-weight:bold;
}

.nav-item div{
font-size:22px;
margin-bottom:3px;
}

.nav-item.active{
color:var(--primary);
}
</style>
</head>

<body>

<script>
const search=document.getElementById("searchInput");

search.addEventListener("keyup",function(){

const value=this.value.toLowerCase();

document.querySelectorAll(".policy-card").forEach(card=>{

const text=card.innerText.toLowerCase();

card.style.display=text.includes(value)?"flex":"none";

});

});
</script>

<script>
