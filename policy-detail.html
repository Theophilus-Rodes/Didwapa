  faq:{
    title:"Vendor Agreement",
    content:`DIDWAPA FREQUENTLY ASKED QUESTIONS (FAQ)

The FAQs About Didwapa

Welcome to the Didwapa Help Centre. Here are answers to the most common questions about using our marketplace.

⸻

General Questions

1. What is Didwapa?

Didwapa is an online marketplace operated by DIDWAPA ESCROW LTD, where individuals and businesses can buy, sell, and advertise products and services across Ghana.

⸻

2. Is Didwapa free to use?

Yes. Creating an account, browsing products, messaging sellers, and posting standard listings are free.

Some premium features, such as promoted ads or business stores, may require payment.

⸻

3. How do I create an account?

Click Sign Up, enter your details, verify your phone number or email, and complete your profile.

⸻

4. Can I use Didwapa without creating an account?

Yes. You can browse listings without an account, but you must register to post ads, contact sellers, save favourites, or use other member features.

⸻

Buying

5. How do I buy a product?

1. Search for the product.
2. Open the listing.
3. Contact the seller.
4. Agree on the price and delivery or meeting arrangement.
5. Inspect the item before completing the purchase where possible.

⸻

6. Can I negotiate prices?

Yes. If the seller allows negotiation, you can discuss the price directly with them.

⸻

7. Can I save products?

Yes. Tap the ❤️ (Favourite) icon to save products to your account.

⸻

8. How do I contact a seller?

You can:

* Send a message through Didwapa Chat.
* Call the seller if a phone number is provided.

⸻

Selling

9. How do I sell on Didwapa?

1. Register an account.
2. Complete your profile.
3. Click Post Ad.
4. Choose a category.
5. Upload photos.
6. Add product details.
7. Publish your listing.

⸻

10. How many ads can I post?

The number of free listings may vary depending on your account type. Additional listings or premium options may be available.

⸻

11. How long will my ad stay online?

Listings remain active for the period specified by Didwapa. You can renew eligible listings before or after they expire.

⸻

12. Can I edit my listing?

Yes. You can edit your listing at any time from My products.

⸻

Business Accounts

13. Can businesses advertise on Didwapa?

Yes. Businesses can create a professional store, post products, and promote their listings.

⸻

14. What is a Verified Seller?

A Verified Seller is a seller who has completed Didwapa’s verification process.

Verification helps build trust but does not guarantee the quality of products or services.

⸻

Safety

15. How can I stay safe?

We recommend that you:

* Meet in safe public places where appropriate.
* Inspect products before paying where possible.
* Ask questions about the product.
* Report suspicious activity.
* Avoid sharing sensitive personal information unnecessarily.

⸻

16. How do I report a scam?

Open the listing or user profile and select Report Problem, or contact our Customer Support team.

⸻

17. Can Didwapa remove fake listings?

Yes. Listings that violate our policies may be removed, and accounts may be suspended or permanently banned.

⸻

Account

18. I forgot my password. What should I do?

Select Forgot Password on the login page and follow the instructions to reset your password.

⸻

19. How do I change my phone number or email?

Go to my Profile and update your contact information. Verification may be required.

⸻

20. Can I delete my account?

Yes. You can request account deletion through Settings or by contacting Customer Support. Certain information may be retained where required by law or to resolve disputes.

⸻

Advertising

21. How do I promote my ad?

You can purchase promotional options such as:

* Featured Ads
* Top Listings
* Homepage Promotions
* Business Store Packages

Availability may vary.

⸻

22. Why isn’t my ad visible?

Your ad may be:

* Awaiting review.
* Expired.
* Removed for violating our policies.
* Incomplete.
* Hidden due to technical issues.

If the issue persists, please contact Customer Support.

⸻

Contact Us

23. How do I contact Didwapa?

DIDWAPA ESCROW LTD

Customer Support

📧 Email: support@didwapa.com

🌐 Website: www.didwapa.com

Business Hours:

Monday – Friday

8:00 AM – 5:00 PM (GMT)

⸻

Need More Help?

⸻

2. Scope

This Policy applies only to orders placed through the official Didwapa website or mobile application using Didwapa’s approved payment process.

Transactions completed outside the platform are not covered.

⸻

3. Order Cancellation by Buyer

A buyer may cancel an order if:

* The seller has not yet shipped or handed over the item.
* The seller agrees to the cancellation.
* The order qualifies under Didwapa’s cancellation rules.

Once an item has been shipped or collection has been arranged, cancellation may no longer be possible unless permitted by this Policy or required by law.

⸻

4. Order Cancellation by Seller

A seller may cancel an order only for valid reasons, including:

* Product is out of stock.
* Incorrect listing price due to a genuine error.
* Product has become damaged or unavailable before dispatch.
* Buyer cannot be contacted after reasonable attempts.

Repeated seller cancellations may affect vendor performance and could result in account restrictions.

⸻

5. Refund Eligibility

A buyer may be eligible for a refund where:

* The order is cancelled before shipment.
* The seller fails to deliver the item.
* The wrong item is delivered.
* The item is significantly different from the listing.
* The item is confirmed to be counterfeit.
* The dispute is resolved in the buyer’s favour.
* A refund is otherwise approved under Didwapa’s policies.

⸻

6. Situations Where Refunds May Not Be Approved

Refund requests may be refused where:

* The buyer changes their mind after receiving an item that matches the listing.
* The buyer damages the item after delivery.
* The buyer fails to report issues within the inspection period.
* The buyer provides false or misleading information.
* The transaction was completed outside the Didwapa platform.

⸻

7. Return of Goods

Where a return is required before a refund:

The buyer must:

* Return the correct item.
* Return all included accessories where applicable.
* Package the item securely.
* Follow Didwapa’s return instructions.

Failure to return the item in accordance with these requirements may affect refund eligibility.

⸻

8. Escrow Transactions

For Escrow Protected orders:

* Payment will not be released while an eligible dispute is under review.
* If the buyer is entitled to a refund, the payment will be handled according to the outcome of the dispute process.
* If the seller is entitled to payment, the funds will be released in accordance with Didwapa’s Escrow Policy.

⸻

9. Refund Method

Approved refunds will generally be made using the original payment method where possible.

Depending on the payment provider, refunds may be made to:

* Mobile Money account
* Bank account
* Payment card
* Other approved payment method

⸻

10. Refund Processing Time

After a refund is approved:

* Didwapa will initiate the refund as soon as reasonably practicable.
* Actual receipt of funds depends on the payment provider, bank, or Mobile Money operator.

Processing times may vary.

⸻

11. Delivery Charges

Delivery charges may or may not be refundable depending on:

* The reason for the refund.
* The stage of delivery.
* The outcome of any dispute.
* Applicable law.

⸻

12. Fraud Prevention

Didwapa may refuse refunds where there is evidence of:

* Fraud.
* Abuse of the refund system.
* False claims.
* Altered evidence.
* Multiple abusive refund requests.

Accounts engaging in fraudulent refund activity may be suspended or permanently terminated.

⸻

13. Partial Refunds

Where appropriate, Didwapa may approve a partial refund if:

* Both parties agree.
* The item has minor defects.
* The buyer chooses to keep the item with compensation.
* The dispute outcome supports a partial refund.

⸻

14. Digital Products and Services

Refund eligibility for digital goods or services may differ depending on:

* Whether delivery has already occurred.
* Whether the service has been performed.
* The specific terms disclosed before purchase.

⸻

15. Changes to this Policy

Updated versions become effective when published on the Didwapa platform unless otherwise stated.

DIDWAPA ESCROW LTD

Customer Support

  buyerProtection:{
    title:"Buyer Protection Policy",
    content:`DIDWAPA ESCROW LTD

BUYER PROTECTION POLICY

Version: 1.0

Effective Date: [Insert Date]

⸻

1. Purpose

At DIDWAPA ESCROW LTD, our mission is to create a safe and trusted marketplace.

This Buyer Protection Policy explains when buyers are protected, how protection works, and the situations where buyer protection may not apply.

⸻

2. What is Buyer Protection?

Buyer Protection is a service that helps eligible buyers resolve problems with transactions completed through Didwapa’s approved payment process.

Buyer Protection is available only for qualifying transactions completed entirely on the Didwapa platform.

⸻

3. Transactions Covered

Buyer Protection may apply when:

* The transaction is completed through Didwapa.
* Payment is made using an approved payment method.
* The transaction follows Didwapa’s escrow process where applicable.
* The buyer complies with all Didwapa policies.

⸻

4. Buyer Protection Covers

Eligible buyers may be protected if:

Item Not Delivered

The seller fails to deliver the purchased item.

⸻

Wrong Item Delivered

The item received is completely different from the listing.

⸻

Counterfeit Products

The buyer receives a fake product advertised as genuine.

⸻

Significant Misrepresentation

The item differs substantially from the seller’s description, including incorrect model, specifications, or condition.

⸻

Damaged Item

The item arrives damaged before the buyer takes possession, where the evidence supports the claim.

⸻

Missing Items

Important accessories or components included in the listing are missing.

⸻

5. Buyer Responsibilities

To qualify for Buyer Protection, buyers should:

* Use Didwapa’s approved payment process.
* Inspect the item promptly after delivery.
* Keep packaging and receipts where appropriate.
* Report problems during the inspection period.
* Provide accurate evidence when requested.
* Cooperate during investigations.

⸻

6. What Buyer Protection Does Not Cover

Buyer Protection generally does not apply where:

* Payment was made outside Didwapa.
* The buyer changes their mind after receiving an item that matches the listing.
* Normal wear and tear is involved.
* Damage occurs after delivery due to the buyer’s actions.
* The buyer submits false or misleading information.
* The inspection period expires without any report where applicable.

⸻

7. Investigation Process

If a buyer reports a problem:

1. The transaction is reviewed.
2. The seller is notified.
3. Both parties may submit evidence.
4. Didwapa reviews the available information.
5. A decision is made based on the evidence.

⸻

8. Evidence

Didwapa may request:

* Photos
* Videos
* Delivery receipts
* Courier tracking information
* Chat history
* Serial or IMEI numbers
* Product packaging
* Other relevant documentation

Failure to provide requested evidence may affect eligibility for Buyer Protection.

⸻

9. Possible Outcomes

Following an investigation, Didwapa may:

* Approve a refund.
* Release payment to the seller.
* Approve a replacement if agreed by both parties.
* Approve a partial refund.
* Request the return of the item before a refund is processed.
* Take other appropriate action consistent with Didwapa policies.

⸻

10. Fraud Prevention

Buyer Protection must not be abused.

Examples of abuse include:

* False delivery claims.
* Fake evidence.
* Returning a different product.
* Repeated fraudulent refund requests.

Accounts found to be abusing Buyer Protection may be suspended or permanently terminated.

⸻

11. Seller Protection

Buyer Protection is balanced with Seller Protection.

Didwapa seeks to ensure that honest sellers are paid for legitimate transactions while protecting buyers from fraud or significant problems.

⸻

12. Inspection Period

Buyers should inspect their items as soon as possible after delivery.

If no issue is reported within the applicable inspection period, the transaction may proceed according to Didwapa’s escrow and payment procedures.

⸻

13. Limitation of Buyer Protection

Buyer Protection is subject to:

* Applicable law.
* Didwapa’s published policies.
* The availability and quality of evidence.
* Compliance with platform rules.

Not every complaint will result in a refund.

⸻

14. Policy Changes

Didwapa may update this Buyer Protection Policy from time to time.

The latest version will be published on the Didwapa platform.

⸻

15. Contact

DIDWAPA ESCROW LTD

Buyer Protection Team

Email: protection@didwapa.com

Website: www.didwapa.com

⸻

16. Acceptance

By placing an order through Didwapa, you acknowledge that you have read, understood, and agreed to this Buyer Protection Policy.

Buyer Protection is provided in accordance with this Policy, the Terms & Conditions, the Escrow Policy, and other applicable Didwapa policies.`

  delivery:{

    content:`DIDWAPA ESCROW LTD

⸻

1. Purpose

This Delivery & Inspection Policy explains how products and services are delivered, inspected, confirmed, and completed on the Didwapa platform.

The purpose of this Policy is to protect both buyers and sellers while ensuring fair and secure transactions.

⸻

2. Scope

This Policy applies to:

* Products purchased through Didwapa.
* Escrow Protected transactions.
* Deliveries arranged by buyers or sellers.
* Pickup transactions.
* Courier deliveries.
* Digital services where applicable.

⸻

3. Delivery Methods

Products may be delivered through:

* Courier Service
* Delivery Company
* Seller Delivery
* Buyer Pickup
* Third-Party Logistics Provider

The delivery method must be selected during checkout.

⸻

4. Seller Responsibilities

Before dispatch, the seller must:

* Verify the order.
* Package the item securely.
* Include all accessories.
* Provide tracking information where available.
* Ship within the promised timeframe.

⸻

5. Buyer Responsibilities

The buyer should:

* Provide an accurate delivery address.
* Be available to receive the order.
* Inspect the package before confirming delivery.
* Report any delivery issues immediately.

⸻

6. Inspection Period

After receiving an order, buyers are given an inspection period to:

* Check the item.
* Test its functionality.
* Compare it with the listing.
* Confirm all accessories are included.

During this period, buyers may report problems through the Didwapa platform.

⸻

7. Product Inspection

Buyers should verify:

* Correct product
* Correct colour
* Correct model
* Correct quantity
* Working condition
* Physical damage
* Missing accessories
* Product authenticity

⸻

8. High-Value Products

For expensive items such as:

* Mobile phones
* Laptops
* Electronics

Buyers are encouraged to:

* Record an unboxing video.
* Photograph any damage immediately.
* Test the item before confirming receipt.

* Interior condition

* Chassis

* Registration documents

const params = new URLSearchParams(location.search);
const policyId = params.get("policy");

const selectedPolicy = policies[policyId];

function makePolicyNice(rawText){
  const lines = rawText
    .split("\n")
    .map(line => line.trim())
    .filter(line => line !== "");

  let html = `<div class="policy-document">`;

  let company = lines[0] || "DIDWAPA ESCROW LTD";
  let policyName = lines[1] || "Policy";
  let version = lines.find(line => line.startsWith("Version:")) || "Version: 1.0";
  let date = lines.find(line => line.startsWith("Effective Date:")) || "Effective Date: [Insert Date]";

  html += `
    <div class="policy-hero">
      <div class="company-name">${company}</div>
      <div class="policy-name">${policyName}</div>
      <div class="meta-row">
        <div class="meta-pill">${version}</div>
        <div class="meta-pill">${date}</div>
      </div>
    </div>
  `;

  let currentTitle = "";
  let currentBody = [];

  function flushSection(){
    if(!currentTitle && currentBody.length === 0) return;

    html += `<div class="section-card">`;

    if(currentTitle){
      html += `<div class="section-title">${currentTitle}</div>`;
    }

    html += `<div class="section-body">`;

    let listOpen = false;
    let flowOpen = false;

    currentBody.forEach(line => {
      if(line === "⸻") return;

      if(line === "↓"){
        if(!flowOpen){
          if(listOpen){
            html += `</div>`;
            listOpen = false;
          }
          html += `<div class="flow-box">`;
          flowOpen = true;
        }

        html += `<div class="flow-arrow">↓</div>`;
        return;
      }

      if(line.startsWith("Step")){
        if(!flowOpen){
          if(listOpen){
            html += `</div>`;
            listOpen = false;
          }
          html += `<div class="flow-box">`;
          flowOpen = true;
        }

        html += `<div class="flow-step">${line}</div>`;
        return;
      }

      if(line.startsWith("•") || line.startsWith("*") || line.startsWith("✓")){
        if(flowOpen){
          html += `</div>`;
          flowOpen = false;
        }

        if(!listOpen){
          html += `<div class="policy-list-items">`;
          listOpen = true;
        }

        let cleanLine = line.replace("•","").replace("*","").replace("✓","").trim();
        let icon = line.startsWith("✓") ? "✓" : "•";

        html += `
          <div class="policy-list-item">
            <span>${icon}</span>
            <div>${cleanLine}</div>
          </div>
        `;
        return;
      }

      if(listOpen){
        html += `</div>`;
        listOpen = false;
      }

      if(flowOpen){
        html += `</div>`;
        flowOpen = false;
      }

      html += `<p>${line}</p>`;
    });

    if(listOpen) html += `</div>`;
    if(flowOpen) html += `</div>`;

    html += `</div></div>`;
  }

  lines.forEach(line => {
    if(
      line === company ||
      line === policyName ||
      line.startsWith("Version:") ||
      line.startsWith("Effective Date:")
    ){
      return;
    }

    if(/^\d+\./.test(line) || line === "Contact"){
      flushSection();
      currentTitle = line;
      currentBody = [];
    }else{
      currentBody.push(line);
    }
  });

  flushSection();

  html += `</div>`;

  return html;
}

if(selectedPolicy){
  document.getElementById("policyTitle").textContent = selectedPolicy.title;
  document.getElementById("policyContent").innerHTML = makePolicyNice(selectedPolicy.content);
}else{
  document.getElementById("policyTitle").textContent = "Policy Not Found";
  document.getElementById("policyContent").innerHTML = `
    <div class="section-card">
      <div class="section-title">Policy Not Found</div>
      <div class="section-body">
        <p>Sorry, this policy could not be found.</p>
      </div>
    </div>
  `;
}
</script>
