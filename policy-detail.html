    content:`DIDWAPA ESCROW LTD

ESCROW POLICY

Version: 1.0

Effective Date: [Insert Date]

⸻

1. Purpose

The Didwapa Escrow Service is designed to protect both buyers and sellers by providing a secure transaction process.

Where a transaction is designated as “Escrow Protected”, payment will follow the procedures described in this Policy.

⸻

2. How Escrow Works

Step 1

Buyer places an order.

↓

Step 2

Buyer completes payment using an approved payment method.

↓

Step 3

Payment is processed according to Didwapa’s approved escrow process.

↓

Step 4

Seller receives notification to prepare and deliver the order.

↓

Step 5

Buyer receives the item.

↓

Step 6

Buyer confirms the item matches the listing.

↓

Step 7

Payment is released according to the escrow process.

⸻

3. Buyer Protection

Buyers receive protection when:

• Product is not delivered.

• Wrong product is delivered.

• Item significantly differs from description.

• Item is damaged before delivery (where evidence supports the claim).

⸻

4. Seller Protection

Sellers receive protection when:

• Buyer receives the correct item.

• Delivery is confirmed.

• Buyer refuses to cooperate without valid reason.

• Buyer attempts fraud.

⸻

5. Escrow Timeline

Typical transaction:

Payment Received

↓

Seller Preparation

↓

Item Shipped

↓

Buyer Receives Item

↓

Buyer Confirmation

↓

Payment Release

⸻

6. Buyer Inspection Period

After delivery, buyers have a limited inspection period to:

• Inspect the item

• Test the item

• Report problems

If no dispute is raised within the inspection period, payment may be released according to Didwapa’s procedures.

⸻

7. Opening a Dispute

A dispute may be opened when:

• Item never arrived.

• Wrong item delivered.

• Counterfeit item.

• Damaged item.

• Missing accessories.

• Seller refuses delivery.

⸻

8. Required Evidence

Didwapa may request:

• Photos

• Videos

• Delivery receipts

• Courier tracking

• Chat history

• Product serial numbers

• IMEI numbers (phones)

• Vehicle documents

• Property documents

⸻

Didwapa reserves the right to investigate any suspicious transaction.

Fraud indicators include:

• Fake payment confirmations

• Stolen identities

• False delivery claims

• Counterfeit products

• Fake tracking numbers

• Multiple fraudulent accounts

⸻

✓ Buyer confirms receipt.

✓ Dispute is resolved in seller’s favour.

⸻

• Cooperate during investigations.

⸻

⸻

⸻

• Illegal goods
• Prohibited items

• High-risk products
• Transactions that violate Ghanaian law


16. Limitation of Service

• Buyers committing fraud.
• Sellers abusing escrow.
• Users attempting to bypass Didwapa.

Users will be notified of significant changes through the platform where appropriate.

Customer Support

    content:`DIDWAPA ESCROW LTD

DISPUTE RESOLUTION POLICY

Version: 1.0

Effective Date: [Insert Date]

⸻

1. Purpose

This Dispute Resolution Policy explains how DIDWAPA ESCROW LTD investigates and resolves disagreements between buyers and sellers using the Didwapa platform.

Our objective is to provide a fair, transparent, and evidence-based process.

⸻

2. Covered Transactions

This policy applies only to transactions completed through Didwapa’s approved checkout and payment process.

Transactions conducted outside the platform are not covered.

⸻

3. When a Buyer Can Open a Dispute

A buyer may open a dispute if:

* The item was never delivered.
* The wrong item was delivered.
* The item is significantly different from the listing.
* The item is counterfeit.
* The item arrived damaged.
* Important accessories or components are missing.
* The seller fails to deliver within the agreed timeframe without explanation.

⸻

4. When a Seller Can Open a Dispute

A seller may open a dispute if:

* The buyer falsely claims non-delivery.
* The buyer refuses to confirm receipt after receiving the item.
* The buyer attempts to obtain a refund after using or keeping the item.
* The buyer makes fraudulent or misleading claims.

⸻

5. How to Open a Dispute

A dispute must be opened from the order page within the inspection period.

The user must:

* Select the reason for the dispute.
* Provide a detailed explanation.
* Upload all available evidence.

⸻

6. Evidence Required

Didwapa may request one or more of the following:

* Photos
* Videos
* Delivery receipts
* Courier tracking information
* Chat history
* Payment records
* Product serial numbers or IMEI numbers
* Vehicle registration documents
* Property ownership documents
* Any other information relevant to the transaction

Failure to provide requested evidence may affect the outcome of the dispute.

⸻

7. Investigation Process

After a dispute is opened:

1. The order is placed under review.
2. Payment remains subject to the escrow process until the dispute is resolved.
3. Both parties may submit evidence.
4. Didwapa reviews the available information.
5. A decision is communicated to both parties.

Didwapa may request additional information if necessary.

⸻

8. Possible Outcomes

Depending on the evidence, Didwapa may:

* Release payment to the seller.
* Refund the buyer.
* Approve a partial refund if both parties agree.
* Request the return of the item before any refund is processed.
* Cancel the transaction where appropriate.

⸻

9. False Claims

Users must not submit false or misleading disputes.

Examples include:

* Claiming an item was not received when it was delivered.
* Submitting altered photos or videos.
* Providing false information during an investigation.

Accounts involved in fraudulent claims may be suspended or permanently removed.

⸻

10. Seller Misconduct

Sellers may face penalties for:

* Selling counterfeit products.
* Misrepresenting products.
* Shipping incorrect items.
* Failing to deliver orders.
* Repeated violations of Didwapa policies.

Penalties may include warnings, suspension, removal of listings, or permanent account termination.

⸻

11. Buyer Misconduct

Buyers may face penalties for:

* Fraudulent refund requests.
* Payment abuse.
* Harassment of sellers.
* Repeated misuse of the dispute system.

Penalties may include warnings, suspension, or permanent account termination.

⸻

12. Final Decision

After reviewing all available evidence, Didwapa will make a decision based on the facts presented.

Where permitted by law, this decision will determine how the transaction is concluded under the Didwapa platform.

⸻

13. Appeals

If a party believes important evidence was not considered, they may request a review within the period specified by Didwapa.

Additional evidence may be required.

Submitting an appeal does not guarantee that the original decision will be changed.

⸻

14. Cooperation

Buyers and sellers agree to cooperate honestly during any investigation.

Failure to respond to requests for information within the stated timeframe may result in the dispute being decided based on the available evidence.

⸻

15. Fraud Prevention

Didwapa reserves the right to monitor transactions, investigate suspicious activity, and report unlawful conduct to the appropriate authorities where required by law.

⸻

16. Contact

DIDWAPA ESCROW LTD

Customer Support

Email: support@didwapa.com

Website: www.didwapa.com`

  refund:{

This Policy applies only to orders placed through the official Didwapa website or mobile application using Didwapa’s approved payment process.

Transactions completed outside the platform are not covered.

⸻

3. Order Cancellation by Buyer

A buyer may cancel an order if:

* The seller has not yet shipped or handed over the item.
* The seller agrees to the cancellation.
* The order qualifies under Didwapa’s cancellation rules.

Once an item has been shipped or collection has been arranged, cancellation may no longer be possible unless permitted by this Policy or required by law.

⸻

4. Order Cancellation by Seller

A seller may cancel an order only for valid reasons, including:

* Product is out of stock.
* Incorrect listing price due to a genuine error.
* Product has become damaged or unavailable before dispatch.
* Buyer cannot be contacted after reasonable attempts.

⸻

5. Refund Eligibility

A buyer may be eligible for a refund where:

* The order is cancelled before shipment.
* The seller fails to deliver the item.
* The wrong item is delivered.
* The item is significantly different from the listing.
* The item is confirmed to be counterfeit.
* The dispute is resolved in the buyer’s favour.

9. Refund Method

  buyerProtection:{
    title:"Buyer Protection Policy",
    content:`DIDWAPA ESCROW LTD

BUYER PROTECTION POLICY

Version: 1.0

Effective Date: [Insert Date]

⸻

1. Purpose

At DIDWAPA ESCROW LTD, our mission is to create a safe and trusted marketplace.

This Buyer Protection Policy explains when buyers are protected, how protection works, and the situations where buyer protection may not apply.

⸻

2. What is Buyer Protection?

Buyer Protection is a service that helps eligible buyers resolve problems with transactions completed through Didwapa’s approved payment process.

Buyer Protection is available only for qualifying transactions completed entirely on the Didwapa platform.

⸻

3. Transactions Covered

Buyer Protection may apply when:

* The transaction is completed through Didwapa.
* Payment is made using an approved payment method.
* The transaction follows Didwapa’s escrow process where applicable.
* The buyer complies with all Didwapa policies.

⸻

4. Buyer Protection Covers

Eligible buyers may be protected if:

Item Not Delivered

The seller fails to deliver the purchased item.

⸻

Wrong Item Delivered

The item received is completely different from the listing.

⸻

Counterfeit Products

The buyer receives a fake product advertised as genuine.

⸻

Significant Misrepresentation

The item differs substantially from the seller’s description, including incorrect model, specifications, or condition.

⸻

Damaged Item

The item arrives damaged before the buyer takes possession, where the evidence supports the claim.

⸻

Missing Items

Important accessories or components included in the listing are missing.

⸻

5. Buyer Responsibilities

To qualify for Buyer Protection, buyers should:

* Use Didwapa’s approved payment process.
* Inspect the item promptly after delivery.
* Keep packaging and receipts where appropriate.
* Report problems during the inspection period.
* Provide accurate evidence when requested.
* Cooperate during investigations.

⸻

6. What Buyer Protection Does Not Cover

Buyer Protection generally does not apply where:

* Payment was made outside Didwapa.
* The buyer changes their mind after receiving an item that matches the listing.
* Normal wear and tear is involved.
* Damage occurs after delivery due to the buyer’s actions.
* The buyer submits false or misleading information.
* The inspection period expires without any report where applicable.

⸻

7. Investigation Process

If a buyer reports a problem:

1. The transaction is reviewed.
2. The seller is notified.
3. Both parties may submit evidence.
4. Didwapa reviews the available information.
5. A decision is made based on the evidence.

⸻

8. Evidence

Didwapa may request:

* Photos
* Videos
* Delivery receipts
* Courier tracking information
* Chat history
* Serial or IMEI numbers
* Product packaging
* Other relevant documentation

Failure to provide requested evidence may affect eligibility for Buyer Protection.

⸻

9. Possible Outcomes

Following an investigation, Didwapa may:

* Approve a refund.
* Release payment to the seller.
* Approve a replacement if agreed by both parties.
* Approve a partial refund.
* Request the return of the item before a refund is processed.
* Take other appropriate action consistent with Didwapa policies.

⸻

10. Fraud Prevention

Buyer Protection must not be abused.

Examples of abuse include:

* False delivery claims.
* Fake evidence.
* Returning a different product.
* Repeated fraudulent refund requests.

Accounts found to be abusing Buyer Protection may be suspended or permanently terminated.

⸻

11. Seller Protection

Buyer Protection is balanced with Seller Protection.

Didwapa seeks to ensure that honest sellers are paid for legitimate transactions while protecting buyers from fraud or significant problems.

⸻

12. Inspection Period

Buyers should inspect their items as soon as possible after delivery.

If no issue is reported within the applicable inspection period, the transaction may proceed according to Didwapa’s escrow and payment procedures.

⸻

13. Limitation of Buyer Protection

Buyer Protection is subject to:

* Applicable law.
* Didwapa’s published policies.
* The availability and quality of evidence.
* Compliance with platform rules.

Not every complaint will result in a refund.

⸻

14. Policy Changes

Didwapa may update this Buyer Protection Policy from time to time.

The latest version will be published on the Didwapa platform.

⸻

15. Contact

DIDWAPA ESCROW LTD

Buyer Protection Team

Email: protection@didwapa.com

Website: www.didwapa.com

⸻

16. Acceptance

By placing an order through Didwapa, you acknowledge that you have read, understood, and agreed to this Buyer Protection Policy.

Buyer Protection is provided in accordance with this Policy, the Terms & Conditions, the Escrow Policy, and other applicable Didwapa policies.`

const params = new URLSearchParams(location.search);
const policyId = params.get("policy");

const selectedPolicy = policies[policyId];

function makePolicyNice(rawText){
  const lines = rawText
    .split("\n")
    .map(line => line.trim())
    .filter(line => line !== "");

  let html = `<div class="policy-document">`;

  let company = lines[0] || "DIDWAPA ESCROW LTD";
  let policyName = lines[1] || "Policy";
  let version = lines.find(line => line.startsWith("Version:")) || "Version: 1.0";
  let date = lines.find(line => line.startsWith("Effective Date:")) || "Effective Date: [Insert Date]";

  html += `
    <div class="policy-hero">
      <div class="company-name">${company}</div>
      <div class="policy-name">${policyName}</div>
      <div class="meta-row">
        <div class="meta-pill">${version}</div>
        <div class="meta-pill">${date}</div>
      </div>
    </div>
  `;

  let currentTitle = "";
  let currentBody = [];

  function flushSection(){
    if(!currentTitle && currentBody.length === 0) return;

    html += `<div class="section-card">`;

    if(currentTitle){
      html += `<div class="section-title">${currentTitle}</div>`;
    }

    html += `<div class="section-body">`;

    let listOpen = false;
    let flowOpen = false;

    currentBody.forEach(line => {
      if(line === "⸻") return;

      if(line === "↓"){
        if(!flowOpen){
          if(listOpen){
            html += `</div>`;
            listOpen = false;
          }
          html += `<div class="flow-box">`;
          flowOpen = true;
        }

        html += `<div class="flow-arrow">↓</div>`;
        return;
      }

      if(line.startsWith("Step")){
        if(!flowOpen){
          if(listOpen){
            html += `</div>`;
            listOpen = false;
          }
          html += `<div class="flow-box">`;
          flowOpen = true;
        }

        html += `<div class="flow-step">${line}</div>`;
        return;
      }

      if(line.startsWith("•") || line.startsWith("*") || line.startsWith("✓")){
        if(flowOpen){
          html += `</div>`;
          flowOpen = false;
        }

        if(!listOpen){
          html += `<div class="policy-list-items">`;
          listOpen = true;
        }

        let cleanLine = line.replace("•","").replace("*","").replace("✓","").trim();
        let icon = line.startsWith("✓") ? "✓" : "•";

        html += `
          <div class="policy-list-item">
            <span>${icon}</span>
            <div>${cleanLine}</div>
          </div>
        `;
        return;
      }

      if(listOpen){
        html += `</div>`;
        listOpen = false;
      }

      if(flowOpen){
        html += `</div>`;
        flowOpen = false;
      }

      html += `<p>${line}</p>`;
    });

    if(listOpen) html += `</div>`;
    if(flowOpen) html += `</div>`;

    html += `</div></div>`;
  }

  lines.forEach(line => {
    if(
      line === company ||
      line === policyName ||
      line.startsWith("Version:") ||
      line.startsWith("Effective Date:")
    ){
      return;
    }

    if(/^\d+\./.test(line) || line === "Contact"){
      flushSection();
      currentTitle = line;
      currentBody = [];
    }else{
      currentBody.push(line);
    }
  });

  flushSection();

  html += `</div>`;

  return html;
}

if(selectedPolicy){
  document.getElementById("policyTitle").textContent = selectedPolicy.title;
  document.getElementById("policyContent").innerHTML = makePolicyNice(selectedPolicy.content);
}else{
  document.getElementById("policyTitle").textContent = "Policy Not Found";
  document.getElementById("policyContent").innerHTML = `
    <div class="section-card">
      <div class="section-title">Policy Not Found</div>
      <div class="section-body">
        <p>Sorry, this policy could not be found.</p>
      </div>
    </div>
  `;
}
</script>
