<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DIDWAPA - Payment</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
    body{background:#f6f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
    .card{width:100%;max-width:430px;background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.12);animation:up .6s ease}
    .icon{font-size:4rem;margin-bottom:12px}
    h1{color:#0a2d73;margin-bottom:10px}
    p{color:#6b7280;line-height:1.6;margin-bottom:20px}
    button{width:100%;height:52px;border:none;border-radius:18px;background:linear-gradient(135deg,#ff6600,#ff4500);color:white;font-weight:900;font-size:1rem;cursor:pointer}
    .loader{width:45px;height:45px;border:5px solid #eee;border-top-color:#ff6600;border-radius:50%;margin:15px auto;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes up{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">💳</div>
    <h1>Payment Processing</h1>
    <p id="msg">Please wait while we process your payment.</p>
    <div class="loader" id="loader"></div>
    <button id="doneBtn" style="display:none;" onclick="window.location.href='purchased-products.html'">
      View Purchased Products
    </button>
  </div>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";
const params = new URLSearchParams(window.location.search);
const productId = params.get("id");
const qty = params.get("qty");

async function completePayment() {
  setTimeout(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/purchase/complete`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
          product_id: productId,
          quantity: qty
        })
      });

      const data = await res.json();

      document.getElementById("loader").style.display = "none";

      if (!data.success) {
        document.getElementById("msg").textContent = data.message;
        return;
      }

      document.querySelector(".icon").textContent = "✅";
      document.querySelector("h1").textContent = "Payment Successful";
      document.getElementById("msg").textContent = data.message;
      document.getElementById("doneBtn").style.display = "block";

    } catch (error) {
      document.getElementById("loader").style.display = "none";
      document.getElementById("msg").textContent = "Payment failed. Please try again.";
    }
  }, 2000);
}

completePayment();
</script>
</body>
</html>
