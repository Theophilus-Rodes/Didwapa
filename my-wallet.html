<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA - My Wallet</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f6f7fb;color:#111827}
.app{max-width:620px;margin:auto;background:white;min-height:100vh}
.header{background:linear-gradient(135deg,#0a2d73,#ff6600);color:white;padding:22px 16px 45px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;animation:down .6s ease}
.top{display:flex;justify-content:space-between;align-items:center}
.back{border:none;background:rgba(255,255,255,.22);color:white;padding:10px 14px;border-radius:999px;font-weight:900;cursor:pointer}
.header h1{margin-top:18px;font-size:1.45rem}
.header p{margin-top:8px;font-size:.88rem;opacity:.9}
.content{padding:16px;margin-top:-30px}
.balance-card{background:white;border-radius:24px;padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.1);animation:up .6s ease;text-align:center}
.balance-card small{color:#6b7280;font-weight:900}
.balance{font-size:2.3rem;font-weight:900;color:#ff6600;margin-top:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{height:48px;border:none;border-radius:16px;font-weight:900;cursor:pointer}
.load{background:#ff6600;color:white}
.history{background:#0a2d73;color:white}
.section-title{margin:22px 0 12px;font-weight:900}
.transactions{display:grid;gap:10px}
.tx{background:#f9fafb;border:1px solid #e5e7eb;border-radius:18px;padding:13px;display:flex;justify-content:space-between;align-items:center;animation:up .5s ease}
.tx h4{font-size:.9rem;margin-bottom:4px}
.tx p{font-size:.72rem;color:#6b7280}
.amount{font-weight:900}
.credit{color:#16a34a}
.debit{color:#dc2626}
.empty{background:#f9fafb;border-radius:18px;padding:24px;text-align:center;color:#6b7280}
@keyframes down{from{transform:translateY(-25px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes up{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:420px){.content{padding:12px}.balance{font-size:1.9rem}.actions{grid-template-columns:1fr}.tx{padding:11px}.tx h4{font-size:.82rem}}
</style>
</head>

<body>

<main class="app">
  <section class="header">
    <div class="top">
      <h3>My Wallet</h3>
      <button class="back" onclick="window.location.href='you.html'">← Back</button>
    </div>

    <h1>Account Balance</h1>
    <p>View the total amount available in your DIDWAPA account.</p>
  </section>

  <section class="content">
    <div class="balance-card">
      <small>Available Balance</small>
      <div class="balance" id="balanceText">GH₵0.00</div>
    
      <div class="actions">
        <button class="btn load" onclick="window.location.href='wallet-topup.html'">
  Load Wallet
</button>
        <button class="btn history" onclick="loadWallet()">Refresh</button>
      </div>
    </div>

    <h3 class="section-title">Recent Transactions</h3>

    <div class="transactions" id="transactionsBox">
      <div class="empty">Loading transactions...</div>
    </div>
  </section>
</main>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";
const balanceText = document.getElementById("balanceText");
const transactionsBox = document.getElementById("transactionsBox");

async function loadWallet(){
  try{
    const res = await fetch(`${API_BASE}/api/user/wallet`, {
      credentials:"include"
    });

    const data = await res.json();

    if(!data.success){
      window.location.href = "userlogin.html";
      return;
    }

    balanceText.textContent = `GH₵${Number(data.balance).toFixed(2)}`;

    if(!data.transactions || data.transactions.length === 0){
      transactionsBox.innerHTML = `
        <div class="empty">
          No wallet transactions yet.
        </div>
      `;
      return;
    }

    transactionsBox.innerHTML = data.transactions.map(tx => `
      <div class="tx">
        <div>
          <h4>${tx.description || "Wallet transaction"}</h4>
          <p>${new Date(tx.created_at).toLocaleString()}</p>
        </div>

        <div class="amount ${tx.type}">
          ${tx.type === "credit" ? "+" : "-"} GH₵${Number(tx.amount).toFixed(2)}
        </div>
      </div>
    `).join("");

  }catch(error){
    transactionsBox.innerHTML = `
      <div class="empty">
        Failed to load wallet.
      </div>
    `;
  }
}

loadWallet();
</script>

</body>
</html>
