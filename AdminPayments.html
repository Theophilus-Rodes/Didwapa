<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA Admin - Payments</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
:root{--dark:#06152f;--green:#20c463;--red:#ef4444;--orange:#ff6600;--bg:#f4f7fb;--muted:#6b7280;--border:#e5e7eb}
body{background:var(--bg);color:var(--dark)}
.page{width:min(1180px,96%);margin:auto;padding:22px 0}
.top{background:white;border-radius:24px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 38px rgba(6,21,47,.08);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.logo{width:42px;height:42px;border-radius:15px;background:var(--dark);color:var(--green);display:grid;place-items:center}
.back{background:var(--dark);color:white;text-decoration:none;padding:11px 15px;border-radius:14px;font-weight:900}
.header{background:linear-gradient(135deg,var(--dark),#0b244d);color:white;padding:28px;border-radius:28px;margin-bottom:18px}
.header h1{font-size:2.2rem;margin-bottom:8px}
.header p{color:#cbd5e1;line-height:1.6}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.stat{background:white;border-radius:22px;padding:16px;box-shadow:0 14px 30px rgba(6,21,47,.07)}
.stat small{display:block;color:var(--muted);font-weight:900;margin-bottom:8px}
.stat h2{font-size:1.25rem;color:var(--orange)}
.stat.reversed h2{color:var(--red)}

.controls{background:white;border-radius:22px;padding:14px;display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:16px;box-shadow:0 12px 26px rgba(6,21,47,.06)}
input,select{height:46px;border:1px solid var(--border);border-radius:15px;padding:0 13px;background:#f8fafc;outline:none}

.list{display:grid;gap:14px}
.card{background:white;border:1px solid var(--border);border-radius:24px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:14px;box-shadow:0 14px 30px rgba(6,21,47,.07);transition:.25s}
.card:hover{transform:translateY(-4px)}
.card h3{font-size:1rem;margin-bottom:6px}
.card p{font-size:.78rem;color:var(--muted);margin:4px 0}
.amount{color:var(--orange);font-weight:900;font-size:1.2rem;margin-top:8px}
.amount.reversed-text{color:var(--red)}
.right{text-align:right;display:grid;gap:8px;justify-items:end}

.status{display:inline-block;padding:7px 11px;border-radius:999px;font-size:.72rem;font-weight:900;text-transform:capitalize}
.pending{background:#fef3c7;color:#b45309}
.released{background:#d1fae5;color:#047857}
.reversed{background:#fee2e2;color:#b91c1c}

.empty{background:white;border-radius:22px;padding:28px;text-align:center;color:var(--muted)}

@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.card{grid-template-columns:1fr}.right{text-align:left;justify-items:start}}
@media(max-width:480px){.page{width:100%;padding:10px}.top,.header,.card{border-radius:20px}.header h1{font-size:1.45rem}.stats{grid-template-columns:1fr}.card h3{font-size:.9rem}.card p{font-size:.7rem}}
</style>
</head>

<body>

<div class="page">
  <div class="top">
    <div class="brand"><div class="logo">DW</div> Admin Payments</div>
    <a href="admin.html" class="back">← Dashboard</a>
  </div>

  <div class="header">
    <h1>Payments Overview</h1>
    <p>Track admin escrow balance, pending seller payments, released money, and reversed payments.</p>
  </div>

  <section class="stats">
    <div class="stat"><small>Admin Account Balance</small><h2 id="adminBalance">GH₵0.00</h2></div>
    <div class="stat"><small>Total Sales</small><h2 id="totalSales">GH₵0.00</h2></div>
    <div class="stat"><small>Released</small><h2 id="releasedTotal">GH₵0.00</h2></div>
    <div class="stat reversed"><small>Total Reversed</small><h2 id="reversedTotal">GH₵0.00</h2></div>
    <div class="stat"><small>Pending Release</small><h2 id="pendingTotal">GH₵0.00</h2></div>
  </section>

  <section class="controls">
    <input id="searchInput" placeholder="Search seller, product, status..." oninput="filterRecords()">
    <select id="statusFilter" onchange="filterRecords()">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="released">Released</option>
      <option value="reversed">Reversed</option>
    </select>
  </section>

  <section class="list" id="recordsBox">
    <div class="empty">Loading payments...</div>
  </section>
</div>

<script>
const API_BASE = `http://${window.location.hostname}:5000`;
let records = [];



async function checkAdminSession() {
  try {

    const res = await fetch(`${API_BASE}/api/admin/check-session`, {
      credentials: "include"
    });

    const data = await res.json();

    if (
      !data.success ||
      !data.user ||
      !["admin", "vendor"].includes(data.user.role)
    ) {

      localStorage.removeItem("didwapaAdmin");
      localStorage.removeItem("didwapaVendor");

      window.location.href = "login.html";
      return;
    }

  } catch (err) {

    localStorage.removeItem("didwapaAdmin");
    localStorage.removeItem("didwapaVendor");

    window.location.href = "login.html";
  }
}



async function loadPayments(){
  try{
    const res = await fetch(`${API_BASE}/api/admin/payments-overview`, {
      credentials:"include"
    });

    const data = await res.json();

    if(!data.success){
      document.getElementById("recordsBox").innerHTML = `<div class="empty">${data.message}</div>`;
      return;
    }

    records = data.records || [];

    document.getElementById("adminBalance").textContent =
      `GH₵${Number(data.account.balance || 0).toFixed(2)}`;

    const totalSales = records.reduce((sum,r)=>{
      if((r.release_status || "pending") === "reversed"){
        return sum + Number(r.reversed_amount || 0);
      }
      return sum + Number(r.total_amount || 0);
    },0);

    const released = records.reduce((sum,r)=>sum + Number(r.released_amount || 0),0);
    const reversed = records.reduce((sum,r)=>sum + Number(r.reversed_amount || 0),0);
    const pending = records.reduce((sum,r)=>{
      return (r.release_status || "pending") === "pending"
        ? sum + Number(r.balance_amount || 0)
        : sum;
    },0);

    document.getElementById("totalSales").textContent = `GH₵${totalSales.toFixed(2)}`;
    document.getElementById("releasedTotal").textContent = `GH₵${released.toFixed(2)}`;
    document.getElementById("reversedTotal").textContent = `GH₵${reversed.toFixed(2)}`;
    document.getElementById("pendingTotal").textContent = `GH₵${pending.toFixed(2)}`;

    renderRecords(records);

  }catch(error){
    console.error(error);
    document.getElementById("recordsBox").innerHTML = `<div class="empty">Failed to load payments.</div>`;
  }
}

function renderRecords(list){
  const box = document.getElementById("recordsBox");

  if(list.length === 0){
    box.innerHTML = `<div class="empty">No payment records found.</div>`;
    return;
  }

  box.innerHTML = list.map(r => {
    const status = r.release_status || "pending";
    const displayTotal = status === "reversed"
      ? Number(r.reversed_amount || 0)
      : Number(r.total_amount || 0);

    return `
      <div class="card">
        <div>
          <h3>${r.product_name}</h3>
          <p>Seller: ${r.firstname || "Unknown"} ${r.lastname || ""}</p>
          <p>Seller Phone: ${r.telephone || "N/A"}</p>
          <p>Quantity: ${r.quantity} | Unit Price: GH₵${Number(r.unit_price || 0).toFixed(2)}</p>
          <p>Date: ${new Date(r.created_at).toLocaleString()}</p>

          ${status === "reversed" && r.reversed_at
            ? `<p>Reversed At: ${new Date(r.reversed_at).toLocaleString()}</p>`
            : ""
          }

          <div class="amount ${status === "reversed" ? "reversed-text" : ""}">
            ${status === "reversed" ? "Reversed" : "Total"}: GH₵${displayTotal.toFixed(2)}
          </div>
        </div>

        <div class="right">
          <span class="status ${status}">${status}</span>
          <p>Released: GH₵${Number(r.released_amount || 0).toFixed(2)}</p>
          <p>Reversed: GH₵${Number(r.reversed_amount || 0).toFixed(2)}</p>
          <p>Balance: GH₵${Number(r.balance_amount || 0).toFixed(2)}</p>
        </div>
      </div>
    `;
  }).join("");
}

function filterRecords(){
  const key = document.getElementById("searchInput").value.toLowerCase();
  const status = document.getElementById("statusFilter").value;

  const filtered = records.filter(r => {
    const text = `
      ${r.product_name || ""}
      ${r.firstname || ""}
      ${r.lastname || ""}
      ${r.telephone || ""}
      ${r.release_status || ""}
    `.toLowerCase();

    return text.includes(key) && (!status || r.release_status === status);
  });

  renderRecords(filtered);
}

loadPayments();
</script>

</body>
</html>
