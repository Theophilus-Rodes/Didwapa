<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIDWAPA Product Details</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(32, 224, 112, 0.14), transparent 35%),
        linear-gradient(135deg, #f7fafc, #eef4f8);
      color: #06152f;
    }

    .page {
      width: min(1050px, 94%);
      margin: auto;
      padding: 22px 0 40px;
    }

    .top-nav {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 18px 38px rgba(6, 21, 47, 0.08);
      animation: slideDown .6s ease;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 20px;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #06152f;
      color: #20e070;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .back {
      text-decoration: none;
      background: #06152f;
      color: white;
      padding: 11px 15px;
      border-radius: 13px;
      font-weight: 800;
      font-size: 14px;
      transition: .3s ease;
      white-space: nowrap;
    }

    .back:hover {
      background: #20c463;
      transform: translateY(-2px);
    }

    .header {
      background: linear-gradient(135deg, #06152f, #0b244d);
      color: white;
      padding: 28px 32px;
      border-radius: 28px;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 22px 48px rgba(6, 21, 47, 0.20);
      animation: fadeUp .7s ease;
    }

    .header::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: rgba(32, 224, 112, 0.15);
      right: -60px;
      top: -75px;
      animation: float 4s ease-in-out infinite;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 40px);
      position: relative;
      z-index: 2;
    }

    .header p {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.6;
      position: relative;
      z-index: 2;
    }

    .details-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(18px);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(6, 21, 47, 0.08);
      animation: fadeUp .85s ease;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .item {
      background: #f3f6fb;
      padding: 15px 16px;
      border-radius: 18px;
      animation: popIn .45s ease both;
    }

    .item small {
      display: block;
      color: #6b7280;
      margin-bottom: 7px;
      font-weight: 800;
      font-size: 13px;
    }

    .item strong {
      font-size: 16px;
      word-break: break-word;
    }

    .full {
      grid-column: 1 / -1;
    }

    .status {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 30px;
      font-weight: 900;
      text-transform: capitalize;
      font-size: 13px;
    }

    .pending {
      background: #fff3cd;
      color: #b7791f;
    }

    .approved {
      background: #d1fae5;
      color: #047857;
    }

    .denied {
      background: #fee2e2;
      color: #b91c1c;
    }

    .under-review {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .image-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .image-box {
      height: 150px;
      border-radius: 18px;
      overflow: hidden;
      background: white;
      border: 2px solid #e5e7eb;
      box-shadow: 0 10px 25px rgba(6, 21, 47, 0.08);
      cursor: pointer;
      position: relative;
      animation: imagePop .45s ease both;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .35s ease;
    }

    .image-box:hover img {
      transform: scale(1.08);
    }

    .image-box::after {
      content: "Click to view";
      position: absolute;
      inset: auto 10px 10px 10px;
      background: rgba(6, 21, 47, 0.82);
      color: white;
      padding: 7px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      transition: .3s ease;
    }

    .image-box:hover::after {
      opacity: 1;
      transform: translateY(0);
    }

    .buttons {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      padding: 13px 16px;
      border-radius: 14px;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
    }

    .approve {
      background: #20c463;
    }

    .review {
      background: #2563eb;
    }

    .deny {
      background: #dc2626;
    }

    .delete {
  background: #7f1d1d;
}

    .alert {
      position: fixed;
      top: 25px;
      right: 25px;
      background: #06152f;
      color: white;
      padding: 16px 22px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      display: none;
      font-weight: 800;
      z-index: 999;
      animation: slideDown .3s ease;
    }

    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 18px;
      animation: fadeIn .25s ease;
    }

    .image-modal img {
      max-width: 95%;
      max-height: 88vh;
      border-radius: 18px;
      background: white;
      box-shadow: 0 25px 70px rgba(0,0,0,.5);
      animation: zoomIn .25s ease;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 28px;
      color: white;
      font-size: 36px;
      cursor: pointer;
      font-weight: bold;
    }

    .loader {
      width: 38px;
      height: 38px;
      border: 4px solid #e5e7eb;
      border-top-color: #20c463;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin .8s linear infinite;
    }

    .loading-box {
      text-align: center;
      color: #6b7280;
      font-weight: 800;
      padding: 35px;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes imagePop {
      from { opacity: 0; transform: translateY(16px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(14px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes zoomIn {
      from { transform: scale(.88); opacity: .5; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media(max-width: 700px) {
      .page {
        width: 100%;
        padding: 12px;
      }

      .top-nav {
        padding: 12px;
        border-radius: 18px;
      }

      .brand {
        font-size: 17px;
      }

      .brand-badge {
        width: 38px;
        height: 38px;
      }

      .back {
        font-size: 12px;
        padding: 10px 11px;
      }

      .header {
        padding: 22px 18px;
        border-radius: 22px;
      }

      .header h1 {
        font-size: 25px;
      }

      .header p {
        font-size: 13px;
      }

      .details-card {
        padding: 14px;
        border-radius: 22px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .item {
        padding: 12px;
        border-radius: 15px;
      }

      .item small {
        font-size: 11px;
      }

      .item strong {
        font-size: 13px;
      }

      .image-gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .image-box {
        height: 120px;
        border-radius: 14px;
      }

     .buttons {
  grid-template-columns: repeat(4, 1fr);
}

      button {
        padding: 12px;
        font-size: 13px;
      }
    }

    @media(max-width: 420px) {
      .top-nav {
        gap: 8px;
      }

      .brand {
        font-size: 15px;
      }

      .brand-badge {
        width: 34px;
        height: 34px;
        border-radius: 11px;
      }

      .back {
        font-size: 11px;
        padding: 9px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .image-gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .image-box {
        height: 105px;
      }
    }
  </style>
</head>

<body>
  <div class="alert" id="alertBox"></div>

  <div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <span class="close-modal">×</span>
    <img id="modalImage" src="" alt="Product Image" onclick="event.stopPropagation()">
  </div>

  <div class="page">
    <div class="top-nav">
      <div class="brand">
        <div class="brand-badge">DW</div>
        DIDWAPA
      </div>

      <a href="AdminProductApprovals.html" class="back">← Back</a>
    </div>

    <div class="header">
      <h1 id="productTitle">Product Details</h1>
      <p>View full product information, check product images, and update listing status.</p>
    </div>

    <div class="details-card" id="detailsBox">
      <div class="loading-box">
        <div class="loader"></div>
        Loading product details...
      </div>
    </div>
  </div>

  <script>
     const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";

    const detailsBox = document.getElementById("detailsBox");
    const productTitle = document.getElementById("productTitle");
    const alertBox = document.getElementById("alertBox");
    const imageModal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    function statusClass(status) {
      return String(status || "pending").toLowerCase().replaceAll(" ", "-");
    }

    function showAlert(message) {
      alertBox.textContent = message;
      alertBox.style.display = "block";

      setTimeout(() => {
        alertBox.style.display = "none";
      }, 2500);
    }

   function renderProductImages(imagesData) {
  if (!imagesData) {
    return `<strong>No product images uploaded</strong>`;
  }

  let images = [];

  try {
    images = JSON.parse(imagesData);
  } catch (e) {
    images = [imagesData];
  }

  if (!Array.isArray(images) || images.length === 0) {
    return `<strong>No product images uploaded</strong>`;
  }

  return `
    <div class="image-gallery">
      ${images.map((img, index) => {
        let imageUrl = "";

        if (img.startsWith("http://") || img.startsWith("https://")) {
          imageUrl = img;
        } else if (img.startsWith("/uploads/")) {
          imageUrl = `${API_BASE}${img}`;
        } else if (img.startsWith("uploads/")) {
          imageUrl = `${API_BASE}/${img}`;
        } else {
          imageUrl = `${API_BASE}/uploads/${img}`;
        }

        return `
          <div class="image-box" style="animation-delay:${index * 0.06}s" onclick="openImageModal('${imageUrl}')">
            <img 
              src="${imageUrl}" 
              alt="Product Image"
              onerror="this.parentElement.innerHTML='<strong style=&quot;display:flex;align-items:center;justify-content:center;height:100%;color:#777;font-size:13px;&quot;>No Image</strong>'"
            >
          </div>
        `;
      }).join("")}
    </div>
  `;
}

    function openImageModal(src) {
      modalImage.src = src;
      imageModal.style.display = "flex";
    }

    function closeImageModal() {
      imageModal.style.display = "none";
      modalImage.src = "";
    }

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function niceLabel(key){
  return String(key || "")
    .replaceAll("_", " ")
    .replace(/\b\w/g, char => char.toUpperCase());
}

function renderSpecifications(specData){
  if(!specData){
    return "";
  }

  let specs = {};

  try{
    specs = typeof specData === "string" ? JSON.parse(specData) : specData;
  }catch(e){
    return `
      <div class="item full">
        <small>More Product Details</small>
        <strong>${escapeHtml(specData)}</strong>
      </div>
    `;
  }

  const entries = Object.entries(specs).filter(([key, value]) =>
    value !== null &&
    value !== undefined &&
    String(value).trim() !== ""
  );

  if(!entries.length){
    return "";
  }

  return `
    <div class="item full" style="background:#06152f;color:white;">
      <small style="color:#20e070;">More Product Details</small>
      <strong>${escapeHtml(entries.length)} extra field(s)</strong>
    </div>

    ${entries.map(([key, value]) => `
      <div class="item">
        <small>${escapeHtml(niceLabel(key))}</small>
        <strong>${escapeHtml(value)}</strong>
      </div>
    `).join("")}
  `;
}


    async function loadProductDetails() {
      try {
        const res = await fetch(`${API_BASE}/api/admin/products/${productId}`);
        const data = await res.json();

        if (!data.success) {
          detailsBox.innerHTML = `<div class="loading-box">${data.message}</div>`;
          return;
        }

        const p = data.product;

        productTitle.textContent = p.product_name || "Product Details";

        detailsBox.innerHTML = `
          <div class="grid">
            <div class="item">
              <small>Product Name</small>
              <strong>${p.product_name || "N/A"}</strong>
            </div>

            <div class="item">
              <small>Seller</small>
              <strong>${p.firstname || "Unknown"} ${p.lastname || "User"}</strong>
            </div>

            <div class="item">
              <small>Seller Email</small>
              <strong>${p.email || "N/A"}</strong>
            </div>

            <div class="item">
              <small>Seller Telephone</small>
              <strong>${p.telephone || "N/A"}</strong>
            </div>

            <div class="item">
              <small>Category</small>
              <strong>${p.category || "N/A"}</strong>
            </div>

            <div class="item">
              <small>Product Type</small>
              <strong>${p.product_type || "N/A"}</strong>
            </div>

            ${renderSpecifications(p.specifications)}

            <div class="item">
              <small>Price</small>
              <strong>GHS ${p.price || "0.00"}</strong>
            </div>

<div class="item">
  <small>Region</small>
  <strong>${p.region || "N/A"}</strong>
</div>

<div class="item">
  <small>Area / District</small>
  <strong>${p.district || "N/A"}</strong>
</div>

<div class="item full">
  <small>Description</small>
  <strong>${p.description || "No description provided"}</strong>
</div>

 <div class="item full">
              <small>Instructions</small>
              <strong>${p.instructions || "No instructions provided"}</strong>
            </div>

<div class="item">
  <small>Posted Date</small>
  <strong>${p.created_at ? new Date(p.created_at).toLocaleString() : "N/A"}</strong>
</div>


            <div class="item">
              <small>Product Color</small>
              <strong>${p.product_color || "N/A"}</strong>
            </div>

            <div class="item">
              <small>Quantity</small>
              <strong>${p.quantity_in_stock || "0"}</strong>
            </div>

            <div class="item">
              <small>Condition</small>
              <strong>${p.item_condition || "N/A"}</strong>
            </div>

            <div class="item">
              <small>Phone Number</small>
              <strong>${p.phone_number || "N/A"}</strong>
            </div>

            <div class="item">
              <small>Status</small>
              <span class="status ${statusClass(p.status)}">${p.status || "pending"}</span>
            </div>

            <div class="item full">
              <small>Product Images</small>
              ${renderProductImages(p.images)}
            </div>

           
          </div>

          <div class="buttons">
  <button class="approve" onclick="updateStatus('approved')">Approve</button>
  <button class="review" onclick="updateStatus('under review')">Under Review</button>
  <button class="deny" onclick="updateStatus('denied')">Deny</button>
  <button class="delete" onclick="deleteProduct()">Delete</button>
</div>
        `;
      } catch (error) {
        console.error(error);
        detailsBox.innerHTML = `<div class="loading-box">Failed to connect to server.</div>`;
      }
    }

    async function updateStatus(status) {
      try {
        const res = await fetch(`${API_BASE}/api/admin/products/${productId}/status`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ status })
        });

        const data = await res.json();

        if (!data.success) {
          showAlert(data.message);
          return;
        }

        showAlert(data.message);
        loadProductDetails();

      } catch (error) {
        console.error(error);
        showAlert("Failed to update product status.");
      }
    }

    async function deleteProduct() {
  const confirmDelete = confirm("Are you sure you want to delete this product permanently?");

  if (!confirmDelete) return;

  try {
    const res = await fetch(`${API_BASE}/api/admin/products/${productId}`, {
      method: "DELETE"
    });

    const data = await res.json();

    if (!data.success) {
      showAlert(data.message);
      return;
    }

    showAlert("Product deleted successfully.");

    setTimeout(() => {
      window.location.href = "AdminProductApprovals.html";
    }, 1200);

  } catch (error) {
    console.error(error);
    showAlert("Failed to delete product.");
  }
}

    if (!productId) {
      detailsBox.innerHTML = `<div class="loading-box">No product selected.</div>`;
    } else {
      loadProductDetails();
    }
  </script>

  
</body>
</html>
