<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DIDWAPA - Saved Products</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --primary: #ff6600;
      --secondary: #0a2d73;
      --bg: #f6f7fb;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    .app {
      max-width: 720px;
      margin: auto;
      min-height: 100vh;
      background: #fff;
    }

    .header {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
      padding: 22px 16px 40px;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      animation: slideDown .6s ease;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      border: none;
      background: rgba(255,255,255,.22);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      cursor: pointer;
    }

    .header h1 {
      margin-top: 18px;
      font-size: 1.5rem;
    }

    .header p {
      margin-top: 8px;
      font-size: .9rem;
      opacity: .9;
    }

    .content {
      padding: 16px;
      margin-top: -25px;
    }

    .summary {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 14px 30px rgba(0,0,0,.08);
      margin-bottom: 15px;
      animation: fadeUp .6s ease;
    }

    .summary strong {
      color: var(--primary);
      font-size: 1.2rem;
    }

    .cart-list {
      display: grid;
      gap: 14px;
    }

    .cart-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,.06);
      animation: fadeUp .6s ease both;
      transition: .25s ease;
    }

    .cart-card:hover {
      transform: translateY(-4px);
    }

    .cart-img {
      width: 105px;
      height: 105px;
      border-radius: 16px;
      overflow: hidden;
      background: #f3f4f6;
      flex-shrink: 0;
    }

    .cart-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cart-info {
      flex: 1;
    }

    .cart-info h3 {
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .cart-info p {
      color: var(--muted);
      font-size: .8rem;
      margin-bottom: 5px;
    }

    .price {
      color: var(--primary);
      font-weight: 900;
      margin-top: 6px;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 10px 13px;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: .25s ease;
      font-size: .8rem;
    }

    .view-btn {
      background: var(--secondary);
      color: white;
    }

    .remove-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .checkout-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), #ff4500);
      color: white;
      font-weight: 900;
      margin-top: 18px;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 12px 25px rgba(255,102,0,.25);
    }

    .empty {
      background: white;
      padding: 28px;
      text-align: center;
      border-radius: 20px;
      color: var(--muted);
      line-height: 1.7;
      box-shadow: 0 12px 25px rgba(0,0,0,.06);
      animation: fadeUp .6s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeUp {
      from { transform: translateY(25px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media(max-width: 520px) {
      .content {
        padding: 12px;
      }

      .cart-card {
        padding: 10px;
        border-radius: 17px;
      }

      .cart-img {
        width: 88px;
        height: 88px;
      }

      .cart-info h3 {
        font-size: .9rem;
      }

      .cart-info p {
        font-size: .72rem;
      }

      .btn {
        padding: 8px 10px;
        font-size: .72rem;
      }
    }

    @media(max-width: 380px) {
      .cart-card {
        flex-direction: column;
      }

      .cart-img {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <section class="header">
    <div class="top-row">
     <h3>Saved</h3>
      <button class="back-btn" onclick="window.location.href='you.html'">← Back</button>
    </div>

    <h1>Saved Products</h1>
   <p>View all products you have saved to buy later.</p>
  </section>

  <section class="content">
    <div class="summary">
      Total Items: <strong id="totalItems">0</strong><br/>
      Saved Value: <strong id="totalAmount">GH₵0.00</strong>
    </div>

    <div class="cart-list" id="cartList">
    <div class="empty">Loading saved products...</div>
    </div>


  </section>

</main>

<script>
   const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";
  const cartList = document.getElementById("cartList");

  function getFirstImage(images) {
    try {
      const parsed = JSON.parse(images);
      if (Array.isArray(parsed) && parsed.length > 0) {
        let img = parsed[0].replace(/\\/g, "/");

        if (img.startsWith("http")) return img;
        if (img.startsWith("/")) return `${API_BASE}${img}`;

        return `${API_BASE}/${img}`;
      }
      return "";
    } catch {
      return "";
    }
  }

  async function loadCart() {
    try {
      const res = await fetch(`${API_BASE}/api/cart/my-cart`, {
        credentials: "include"
      });

      const data = await res.json();

      if (!data.success) {
        window.location.href = "userlogin.html";
        return;
      }

      const items = data.cart;

      document.getElementById("totalItems").textContent = items.length;

      const total = items.reduce((sum, item) => {
        return sum + (Number(item.price) * Number(item.quantity));
      }, 0);

      document.getElementById("totalAmount").textContent =
`GH₵${total.toLocaleString(undefined,{
  minimumFractionDigits:2,
  maximumFractionDigits:2
})}`;

      if (items.length === 0) {
        cartList.innerHTML = `
          <div class="empty">
            No saved products yet.<br/>
            Save products to view them here..
          </div>
        `;
        return;
      }

      cartList.innerHTML = items.map(item => {
        const image = getFirstImage(item.images);

        return `
          <div class="cart-card">
            <div class="cart-img">
              ${
                image
                ? `<img src="${image}" alt="${item.product_name}">`
                : `<img src="https://via.placeholder.com/300x300?text=No+Image">`
              }
            </div>

            <div class="cart-info">
              <h3>${item.product_name}</h3>
              <p>Color: ${item.product_color || "N/A"}</p>
              <p>Condition: ${item.item_condition || "N/A"}</p>
              <p>Quantity: ${item.quantity}</p>

           <div class="price">
  GH₵${Number(item.price).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })}
</div>

              <div class="actions">
                <button class="btn view-btn" onclick="window.location.href='product-details.html?id=${item.product_id}'">
                  View
                </button>

                <button class="btn remove-btn" onclick="removeCartItem(${item.cart_id})">
                  Remove
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");

    } catch (error) {
      console.error(error);
      cartList.innerHTML = `
        <div class="empty">
          Failed to load saved products.
        </div>
      `;
    }
  }

  async function removeCartItem(cartId) {
    if (!confirm("Remove this saved product?")) return;

    try {
      const res = await fetch(`${API_BASE}/api/cart/remove/${cartId}`, {
        method: "DELETE",
        credentials: "include"
      });

      const data = await res.json();

      if (data.success) {
        loadCart();
      } else {
        alert(data.message);
      }

    } catch (error) {
      alert("Failed to remove item.");
    }
  }



  loadCart();
</script>

</body>
</html>
