<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DIDWAPA - Purchase Product</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
    body{background:#f6f7fb;color:#111827}
    .app{max-width:620px;margin:auto;background:#fff;min-height:100vh}
    .header{background:linear-gradient(135deg,#0a2d73,#ff6600);color:white;padding:22px 16px 42px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;animation:down .6s ease}
    .back{border:none;background:rgba(255,255,255,.2);color:white;padding:10px 14px;border-radius:999px;font-weight:900;cursor:pointer}
    .header h1{margin-top:18px;font-size:1.45rem}
    .content{padding:16px;margin-top:-25px}
    .card{background:white;border-radius:22px;padding:16px;box-shadow:0 15px 35px rgba(0,0,0,.08);animation:up .6s ease}
    .image{height:250px;border-radius:18px;overflow:hidden;background:#f3f4f6;margin-bottom:14px}
    .image img{width:100%;height:100%;object-fit:cover}
    h2{font-size:1.25rem;margin-bottom:8px}
    .price{color:#ff6600;font-size:1.3rem;font-weight:900;margin-bottom:14px}

    .product-info-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:12px;
}

.info{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px;
  min-height:72px;
  box-shadow:0 3px 10px rgba(10,45,115,.04);
}

.info strong{
  display:block;
  color:#0a2d73;
  font-size:.65rem;
  font-weight:900;
  text-transform:uppercase;

}

@media(max-width:620px){
  .product-info-grid{

  }
}

@media(max-width:480px){
  .product-info-grid{
    grid-template-columns:repeat(4,1fr);

  }
}


    input{width:100%;height:48px;border:1px solid #e5e7eb;border-radius:15px;padding:0 12px;font-size:1rem;outline:none}
    input:focus{border-color:#ff6600;box-shadow:0 0 0 4px rgba(255,102,0,.12)}
    .total{margin-top:14px;background:#f3f6fb;padding:14px;border-radius:15px;font-weight:900}
    button.pay{width:100%;height:52px;border:none;border-radius:18px;background:linear-gradient(135deg,#ff6600,#ff4500);color:white;font-weight:900;font-size:1rem;margin-top:18px;cursor:pointer}

    .buy-modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:18px;
    }

    .buy-card{
      width:100%;
      max-width:390px;
      background:white;
      border-radius:28px;
      padding:25px;
      text-align:center;
      box-shadow:0 25px 60px rgba(0,0,0,.25);

    }

    .buy-icon{
      font-size:3.5rem;

    }

    .buy-card h2{
      color:#0a2d73;
      margin-bottom:8px;
    }

    .buy-card p{
      color:#6b7280;

    }

    .buy-card button{
      width:100%;

    }

    .modal-message{background:#0a2d73;color:white}
    .modal-cart{background:#111827;color:white}
    .modal-pay{background:linear-gradient(135deg,#ff6600,#ff4500);color:white}
    .modal-cancel{background:#f3f4f6;color:#111827}

    @keyframes down{from{transform:translateY(-25px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes up{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes modalPop{from{transform:scale(.88) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

    @media(max-width:480px){
      .content{padding:12px}
      .image{height:210px}
      .card{padding:13px;border-radius:18px}
      .buy-card{padding:20px;border-radius:24px}
    }

    .extra-section{
  margin-top:18px;
  background:white;
  border-radius:22px;
  padding:16px;
  box-shadow:0 12px 28px rgba(0,0,0,.06);
}

.extra-title{

}

.comment-box textarea{

.comment-box button{

.comment-item{

}

.comment-item strong{

}

.comment-item small{

}

.related-grid{

}

.related-card{

}

.related-card img{

}

.related-info{

}

.related-info strong{

}

.related-info span{

  font-size:.9rem;
}

.call-btn{
  width:100%;
  height:50px;
  border-radius:16px;
  background:#16a34a;
  color:white;
  display:flex;
  align-items:center;

  text-decoration:none;

}

.callback-btn{
  width:100%;
  height:46px;
  border:none;
  border-radius:16px;
  background:#16a34a;
  color:white;
  font-weight:900;

}

.callback-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;

}

.callback-card{
  width:100%;
  max-width:380px;
  background:white;

}

.callback-card h2{
  margin-bottom:14px;

}

.callback-card label{
  font-weight:900;
  font-size:.85rem;
  margin-top:10px;
  display:block;
}

.callback-card input{
  width:100%;
  height:45px;
  margin-top:6px;
  border:1px solid #e5e7eb;
  border-radius:14px;

}

.callback-card button{
  width:100%;

  border:none;
  border-radius:15px;
  margin-top:14px;

  color:white;
  font-weight:900;
}

.cancel-callback{
  background:#111827 !important;
}

.image-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;

}

.image-modal img{
  max-width:95%;

}

.close-img{

}

.img-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
  font-size:28px;
  font-weight:900;
}

.prev-img{left:15px}
.next-img{right:15px}

.image-count{
  position:absolute;
  bottom:18px;
  color:white;
  font-weight:900;
}

.spec-section{
  background:#fff;
  margin:14px -16px 12px;
  padding:16px 18px;
  border-top:8px solid #edf4ff;
  border-bottom:8px solid #edf4ff;
}

.spec-title{
  font-size:1rem;
  font-weight:900;
  color:#0a2d73;
  margin-bottom:14px;
}

.spec-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:6px;
}

.spec-item{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:8px;
  min-height:55px;
  box-shadow:0 3px 10px rgba(10,45,115,.04);
}

.spec-item span{
  display:block;
  color:#111827;
  font-size:.9rem;

}

.spec-item small{

  display:block;

}

.spec-long{
  grid-column:1 / -1;

}

.spec-long span{

  font-weight:500;
}

@media(max-width:620px){
  .spec-grid{
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
  }

  .spec-item{
    padding:5px;
    min-height:45px;
  }

  .spec-item span{
    font-size:.68rem;
  }
.info strong{
  font-size:.62rem;
}

.spec-item small{
  font-size:.45rem;
}
}


.spec-item span{
  display:block;
  color:#111827;
  font-size:.82rem;

}

.spec-item small{
  display:block;
  color:#78909c;

  font-weight:800;

}

.spec-hidden{

}

.show-more-btn{

}

  </style>
</head>

<body>

<div class="buy-modal" id="buyModal">
  <div class="buy-card">
    <div class="buy-icon">🛍️</div>
    <h2>Choose Action</h2>
    <p>This product is available. What would you like to do?</p>

    <button class="modal-message" onclick="openMessagePage()">Send Owner Message</button>
    <button class="modal-cart" onclick="addToCartFromModal()">Save Product</button>
    <!-- <button class="modal-pay" onclick="finalizePayment()">Finalize Payment</button> -->
    <button class="modal-cancel" onclick="closeBuyModal()">Cancel</button>
  </div>
</div>


<div class="callback-modal" id="callbackModal">
  <div class="callback-card">
    <h2>Request Call Back</h2>

    <label>Your Name</label>
    <input type="text" id="buyerName" readonly>

    <label>Your Telephone</label>
    <input type="text" id="buyerPhone" readonly>

    <label>Product</label>
    <input type="text" id="callbackProduct" readonly>

    <button onclick="sendCallbackRequest()">Send Request</button>
    <button class="cancel-callback" onclick="closeCallbackBox()">Cancel</button>
  </div>
</div>

<main class="app">
  <section class="header">
    <button class="back" onclick="history.back()">← Back</button>
    <h1>Confirm Purchase</h1>
  </section>

<section class="content">
  <div class="card" id="productBox">Loading...</div>

  <div class="extra-section">
    <div class="extra-title">Comments</div>

    <div class="comment-box">
      <textarea id="commentInput" placeholder="Write your comment about this product..."></textarea>
      <button onclick="submitComment()">Post Comment</button>
    </div>

    <div id="commentsBox">Loading comments...</div>
  </div>

  <div class="extra-section">
    <div class="extra-title">Related Products</div>
    <div class="related-grid" id="relatedBox">Loading related products...</div>
  </div>
</section>
</main>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";
const productId = new URLSearchParams(window.location.search).get("id");

let product = null;
let selectedQty = 1;

let productImages = [];
let currentImageIndex = 0;

function openImageModal(index = 0){
  if(!productImages.length) return;

  currentImageIndex = index;
  document.getElementById("modalImage").src = productImages[currentImageIndex];
  document.getElementById("imageCount").textContent =
    `${currentImageIndex + 1} / ${productImages.length}`;

  document.getElementById("imageModal").style.display = "flex";
}

function closeImageModal(){
  document.getElementById("imageModal").style.display = "none";
  document.getElementById("modalImage").src = "";
}

function nextImage(){
  currentImageIndex = (currentImageIndex + 1) % productImages.length;
  openImageModal(currentImageIndex);
}

function prevImage(){
  currentImageIndex =
    (currentImageIndex - 1 + productImages.length) % productImages.length;
  openImageModal(currentImageIndex);
}
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("DOMContentLoaded", () => {
  const modalImg = document.getElementById("modalImage");

  modalImg.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
  });

  modalImg.addEventListener("touchend", (e) => {
    touchEndX = e.changedTouches[0].screenX;

    if (touchStartX - touchEndX > 50) {
      nextImage();   // Swipe left
    }

    if (touchEndX - touchStartX > 50) {
      prevImage();   // Swipe right
    }
  });
});

function getProductImages(images) {
  try {
    const parsed = JSON.parse(images || "[]");

    return parsed.map(img => {
      img = String(img || "").replace(/\\/g, "/");

      if (img.startsWith("http://") || img.startsWith("https://")) return img;
      if (img.startsWith("/uploads/")) return API_BASE + img;
      if (img.startsWith("uploads/")) return API_BASE + "/" + img;

      return API_BASE + "/uploads/" + img;
    }).filter(Boolean);

  } catch {
    return [];
  }
}

function safeText(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function niceLabel(key){
  return String(key || "")
    .replaceAll("_"," ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

function renderProductDetails(product){
  let normalDetails = [];
  let longDetails = [];

  const normalFields = {
    product_type: product.product_type,
    product_color: product.product_color,
    delivery_available: product.delivery_available,
    delivery_fee_type: product.delivery_fee_type,
    delivery_time: product.delivery_time,
    pickup_available: product.pickup_available,
    bulk_min_qty: product.bulk_min_qty,
    bulk_price: product.bulk_price,
    registered_car: product.registered_car
  };

  Object.entries(normalFields).forEach(([key, value]) => {
    if (
      value !== null &&
      value !== undefined &&
      String(value).trim() !== "" &&
      String(value).trim().toLowerCase() !== "null"
    ) {
      normalDetails.push([key, value]);
    }
  });

  if(product.specifications){
    try{
      const specs = typeof product.specifications === "string"
        ? JSON.parse(product.specifications)
        : product.specifications;

      Object.entries(specs).forEach(([key, value]) => {
        if (
          key !== "title" &&
          value !== null &&
          value !== undefined &&
          String(value).trim() !== "" &&
          String(value).trim().toLowerCase() !== "null"
        ) {
          normalDetails.push([key, value]);
        }
      });
    }catch(error){
      console.log("Invalid specifications JSON:", error);
    }
  }

  if(product.description){
    longDetails.push(["description", product.description]);
  }

  if(product.instructions){
    longDetails.push(["instructions", product.instructions]);
  }

  const allNormal = normalDetails;
  const firstFour = allNormal.slice(0, 4);
  const remaining = allNormal.slice(4);

  return `
    <div class="spec-section">
      <div class="spec-title">Product Details</div>

      <div class="spec-grid">
        ${firstFour.map(([key,value]) => `
          <div class="spec-item">
            <span>${safeText(value)}</span>
            <small>${safeText(niceLabel(key))}</small>
          </div>
        `).join("")}

        ${remaining.map(([key,value]) => `
          <div class="spec-item spec-hidden extra-spec">
            <span>${safeText(value)}</span>
            <small>${safeText(niceLabel(key))}</small>
          </div>
        `).join("")}

        ${longDetails.map(([key,value]) => `
          <div class="spec-item spec-long spec-hidden extra-spec">
            <span>${safeText(value)}</span>
            <small>${safeText(niceLabel(key))}</small>
          </div>
        `).join("")}
      </div>

      ${
        remaining.length || longDetails.length
        ? `<div class="show-more-btn" onclick="toggleSpecs(this)">Show more⌄</div>`
        : ""
      }
    </div>
  `;
}


function toggleSpecs(btn){
  const hidden = document.querySelectorAll(".extra-spec");
  const showing = hidden[0]?.style.display === "block";

  hidden.forEach(el => {
    el.style.display = showing ? "none" : "block";
  });

  btn.innerHTML = showing ? "Show more⌄" : "Hide⌃";
}

function isNegotiableProduct(){
  return String(product?.negotiable || "").toLowerCase() === "yes";
}

function toggleOfferBox(){
  const box = document.getElementById("offerBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

async function sendPriceOffer(){
  if(!buyerInfo){
    alert("Please login first.");
    window.location.href = "userlogin.html";
    return;
  }

  const amount = Number(document.getElementById("suggestedAmount").value || 0);
  const message = document.getElementById("offerMessage").value || "";

  if(!amount || amount <= 0){
    alert("Enter a valid suggested amount.");
    return;
  }

  try{
    const res = await fetch(`${API_BASE}/api/products/${productId}/price-offer`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"include",
      body:JSON.stringify({
        suggested_amount: amount,
        message
      })
    });

    const data = await res.json();

    if(!data.success){
      alert(data.message);
      return;
    }

    alert("Your suggested price has been sent to the seller.");
    document.getElementById("suggestedAmount").value = "";
    document.getElementById("offerMessage").value = "";
    toggleOfferBox();

  }catch(error){
    console.error(error);
    alert("Failed to send suggested price.");
  }
}

async function loadProduct() {
  try {
    const res = await fetch(`${API_BASE}/api/products/${productId}`);
    const data = await res.json();

    if (!data.success) {
      document.getElementById("productBox").innerHTML = "Product not found.";
      return;
    }

    product = data.product;
  productImages = getProductImages(product.images);
const image = productImages[0] || "";

    document.getElementById("productBox").innerHTML = `
    <div class="image" onclick="openImageModal(0)">
  <img
    src="${image || 'https://via.placeholder.com/400'}"
    onerror="this.outerHTML='<div style=&quot;padding:80px 20px;text-align:center;color:#777;font-weight:900;&quot;>No Image</div>'"
  >
</div>

      <h2>${product.product_name}</h2>
     <div class="price">GH₵${Number(product.price).toLocaleString(undefined, {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
})}</div>

     <div class="product-info-grid">

 <div class="info">
    <strong>Region</strong>
    ${product.region || "N/A"}
  </div>

    <div class="info">
    <strong>District</strong>
    ${product.district || "N/A"}
  </div>

 

  <div class="info">
    <strong>Condition</strong>
    ${product.item_condition || "N/A"}
  </div>


</div>

${renderProductDetails(product)}
${renderSellerCard(product)}

${isNegotiableProduct() ? `
  <button class="suggest-btn" onclick="toggleOfferBox()">💬 Suggest Pay</button>

  <div class="offer-box" id="offerBox">
    <strong>Suggest your price</strong>
    <p style="font-size:.85rem;color:#6b7280;margin:7px 0;">
     Original price: GH₵${Number(product.price).toLocaleString(undefined, {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
})}
    </p>

    <input type="number" id="suggestedAmount" placeholder="Enter your suggested amount">

    <input 
      type="text" 
      id="offerMessage" 
      placeholder="Message to seller, optional"
      style="margin-top:10px;"
    >

    <button class="suggest-btn" onclick="sendPriceOffer()">Send Suggestion</button>
  </div>
` : ""}

<a 
  href="tel:${product.phone_number}" 
  class="call-btn"
>
  📞 Call Seller
</a>


      <div class="total" id="totalBox">
        Total: GH₵${Number(product.price).toLocaleString(undefined, {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
})}
      </div>

      <button class="pay" onclick="continueToOptions()">Proceed</button>

<button class="callback-btn" onclick="openCallbackBox()">
  📞 Request Seller to Call Back
</button>


    `;
  } catch (error) {
    console.error(error);
    document.getElementById("productBox").innerHTML = "Failed to load product.";
  }
}



function calculateTotal() {
  const qty = Number(document.getElementById("quantity").value || 1);
  const total = qty * Number(product.price);
 document.getElementById("totalBox").textContent = `Total: GH₵${total.toLocaleString(undefined, {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
})}`;
}

function continueToOptions() {
  const qty = Number(document.getElementById("quantity").value);

  if (!qty || qty <= 0) {
    alert("Enter a valid quantity.");
    return;
  }

  if (qty > Number(product.quantity_in_stock)) {
    alert(`Only ${product.quantity_in_stock} item(s) available.`);
    return;
  }

  selectedQty = qty;
  document.getElementById("buyModal").style.display = "flex";
}

function closeBuyModal() {
  document.getElementById("buyModal").style.display = "none";
}

function openMessagePage() {
  window.location.href = `product-message.html?id=${productId}`;
}

async function addToCartFromModal() {
  try {
    const res = await fetch(`${API_BASE}/api/cart/add`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({
        product_id: productId
      })
    });

    const data = await res.json();

    if (!data.success) {
      alert(data.message);

      if (res.status === 401) {
        window.location.href = "userlogin.html";
      }

      return;
    }

    alert(data.message);
    closeBuyModal();

  } catch (error) {
    console.error(error);
    alert("Failed to save product.");
  }
}





function finalizePayment() {
  window.location.href = `choose-payment-method.html?id=${productId}&qty=${selectedQty}`;
}


async function submitComment() {
  const commentInput = document.getElementById("commentInput");
  const comment = commentInput.value.trim();

  if (!comment) {
    alert("Please write a comment first.");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/products/${productId}/comments`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({ comment })
    });

    const data = await res.json();

    if (!data.success) {
      alert(data.message);
      return;
    }

    commentInput.value = "";
    loadComments();

  } catch (error) {
    console.error(error);
    alert("Failed to post comment.");
  }
}

async function loadComments() {
  try {
    const res = await fetch(`${API_BASE}/api/products/${productId}/comments`);
    const data = await res.json();

    const commentsBox = document.getElementById("commentsBox");

    if (!data.success || data.comments.length === 0) {
      commentsBox.innerHTML = `<div class="comment-item">No comments yet.</div>`;
      return;
    }

    commentsBox.innerHTML = data.comments.map(c => `
      <div class="comment-item">
        <strong>${c.firstname || "Guest"} ${c.lastname || ""}</strong>
        <p>${c.comment}</p>
        <small>${new Date(c.created_at).toLocaleString()}</small>
      </div>
    `).join("");

  } catch (error) {
    console.error(error);
    document.getElementById("commentsBox").innerHTML = "Failed to load comments.";
  }
}

async function loadRelatedProducts() {
  try {
    const res = await fetch(`${API_BASE}/api/products/${productId}/related`);
    const data = await res.json();

    const relatedBox = document.getElementById("relatedBox");

    if (!data.success || data.products.length === 0) {
      relatedBox.innerHTML = "No related products found.";
      return;
    }

    relatedBox.innerHTML = data.products.map(p => {
      const relatedImages = getProductImages(p.images);
const image = relatedImages[0] || "";

      return `
        <div class="related-card" onclick="window.location.href='product-details.html?id=${p.id}'">
          <img src="${image || 'https://via.placeholder.com/300'}">
          <div class="related-info">
            <strong>${p.product_name}</strong>
            <span>GH₵${Number(p.price).toFixed(2)}</span>
          </div>
        </div>
      `;
    }).join("");

  } catch (error) {
    console.error(error);
    document.getElementById("relatedBox").innerHTML = "Failed to load related products.";
  }
}



let buyerInfo = null;

async function loadBuyerInfo(){
  try{
    const res = await fetch(`${API_BASE}/api/check-user-login`, {
      credentials:"include"
    });

    const data = await res.json();

    if(data.loggedIn){
      buyerInfo = data.user;
      return;
    }

    buyerInfo = null;

  }catch(error){
    console.error(error);
    buyerInfo = null;
  }
}

function openCallbackBox(){
  if(!buyerInfo){
    alert("Please login first.");
    window.location.href = "userlogin.html";
    return;
  }

  document.getElementById("buyerName").value =
  `${buyerInfo.firstname || ""} ${buyerInfo.lastname || ""}`.trim() ||
  buyerInfo.username ||
  "Buyer";

document.getElementById("buyerPhone").value =
  buyerInfo.telephone ||
  buyerInfo.phone ||
  buyerInfo.phone_number ||
  "";

  document.getElementById("callbackProduct").value =
    product.product_name || "";

  document.getElementById("callbackModal").style.display = "flex";
}

function closeCallbackBox(){
  document.getElementById("callbackModal").style.display = "none";
}

function sendCallbackRequest(){
  const name = document.getElementById("buyerName").value;
  const phone = document.getElementById("buyerPhone").value;
  const productName = document.getElementById("callbackProduct").value;

  const message = `Hello, my name is ${name}. My phone number is ${phone}. Please call me back about ${productName}.`;

  window.location.href =
    `product-message.html?id=${productId}&autoMessage=${encodeURIComponent(message)}`;
}

loadBuyerInfo();
function renderSellerCard(product){
  const sellerName =
    `${product.firstname || ""} ${product.lastname || ""}`.trim() ||
    "DIDWAPA Seller";

  const verified =
    String(product.verification_status || "").toLowerCase() === "approved"
      ? "Verified ID"
      : "Seller";

  const totalAds = product.seller_total_ads || 0;

  let joinedText = "New seller";

  if(product.user_created_at){
    const joinedYear = new Date(product.user_created_at).getFullYear();
    const currentYear = new Date().getFullYear();
    const years = currentYear - joinedYear;

    joinedText = years > 0 ? `${years}+ years on DIDWAPA` : "Joined recently";
  }

  return `
    <div class="seller-card" onclick="window.location.href='seller-products.html?seller_id=${product.posted_by}'">
      <div class="seller-avatar">👤</div>

      <div class="seller-info">
        <h3>${safeText(sellerName)}</h3>

        <div class="seller-badges">
          <span>✔ ${safeText(verified)}</span>
          <span>📦 ${totalAds} active ads</span>
          <span>🕒 ${safeText(joinedText)}</span>
        </div>
      </div>
    </div>
  `;
}

loadProduct();
loadComments();
loadRelatedProducts();
</script>
