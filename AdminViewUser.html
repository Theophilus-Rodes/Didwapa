<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA View User</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f7fafc,#eef4f8);color:#07152c}
.container{width:min(1150px,94%);margin:auto;padding:22px 0 40px}.back-btn{display:inline-block;margin-bottom:18px;background:#07152c;color:white;padding:12px 18px;border-radius:14px;text-decoration:none;font-weight:900}.top{background:linear-gradient(135deg,#07152c,#ff6600);color:white;padding:28px 32px;border-radius:28px;margin-bottom:20px;box-shadow:0 22px 48px rgba(6,21,47,.20)}.top h1{margin:0;font-size:clamp(26px,4vw,40px)}.top p{color:#f8fafc;margin-bottom:0}.details{background:rgba(255,255,255,.94);padding:22px;border-radius:26px;box-shadow:0 18px 40px rgba(6,21,47,.08)}.section-title{margin:24px 0 12px;color:#0a2d73;font-size:1.1rem;font-weight:900;border-left:5px solid #ff6600;padding-left:10px}.section-title:first-child{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{background:#f8fafc;padding:14px;border-radius:18px;border:1px solid #e5e7eb;word-break:break-word}.item.full{grid-column:1/-1}.item strong{display:block;color:#64748b;font-size:11px;margin-bottom:7px;text-transform:uppercase}.item span{font-weight:800;color:#0f172a;font-size:14px;white-space:pre-wrap}.badge{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:900;display:inline-block;text-transform:capitalize}.approved{background:#dcfce7;color:#15803d}.pending{background:#fef3c7;color:#b45309}.denied,.rejected{background:#fee2e2;color:#b91c1c}.empty-badge{background:#e5e7eb;color:#374151}.image-grid{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.image-box{background:white;border-radius:20px;padding:12px;border:1px solid #e5e7eb;box-shadow:0 12px 28px rgba(6,21,47,.08);cursor:pointer;overflow:hidden}.image-box h3{margin:0 0 10px;font-size:14px;color:#0a2d73}.image-box img{width:100%;height:170px;border-radius:14px;object-fit:cover;background:#e5e7eb}.file-link{display:block;background:#fff7ed;color:#c2410c;padding:14px;border-radius:14px;text-decoration:none;font-weight:900;border:1px solid #fed7aa}.no-file{color:#64748b;background:#f1f5f9;padding:14px;border-radius:14px;font-weight:800}.image-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}.image-modal img{max-width:95%;max-height:90vh;border-radius:18px;background:white}.close-modal{position:absolute;top:20px;right:30px;color:white;font-size:40px;font-weight:bold;cursor:pointer}.loading{text-align:center;color:#64748b;font-weight:900;padding:30px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.image-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.container{width:100%;padding:12px}.top{padding:22px 18px;border-radius:22px}.details{padding:14px;border-radius:20px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.item{padding:10px;border-radius:14px}.item strong{font-size:9px}.item span{font-size:11px}.image-grid{grid-template-columns:repeat(2,1fr);gap:9px}.image-box{padding:8px;border-radius:14px}.image-box img{height:105px}.image-box h3{font-size:11px}}
</style>
</head>
<body>
<div class="container">
<a href="AdminUsers.html" class="back-btn">← Back to Users</a>
<div class="top"><h1>User Full Details</h1><p>All saved personal, identity and business information about this user.</p></div>
<div class="details"><div id="userDetails" class="loading">Loading user details...</div></div>
</div>
<div class="image-modal" id="imageModal" onclick="closeImageModal()"><span class="close-modal">×</span><img id="modalImage" src="" onclick="event.stopPropagation()"></div>
<script>
const API_BASE=window.location.hostname==="localhost"||window.location.hostname==="127.0.0.1"?"http://localhost:5000":"";
const userDetails=document.getElementById("userDetails");const params=new URLSearchParams(window.location.search);const userId=params.get("id");
function clean(value){if(value===null||value===undefined||value==="")return "Not provided";return String(value)}
function formatDate(value){if(!value)return "Not provided";const date=new Date(value);if(isNaN(date.getTime()))return clean(value);return date.toLocaleString()}
function badge(value){const text=clean(value);const cls=text==="Not provided"?"empty-badge":text.toLowerCase().replaceAll(" ","_");return `<span class="badge ${cls}">${text}</span>`}
function detail(label,value,full=false){return `<div class="item ${full?"full":""}"><strong>${label}</strong><span>${clean(value)}</span></div>`}
function statusDetail(label,value){return `<div class="item"><strong>${label}</strong><span>${badge(value)}</span></div>`}
function getFileUrl(value){if(!value)return "";value=String(value);if(value.startsWith("http://")||value.startsWith("https://"))return value;if(value.startsWith("/uploads/"))return `${API_BASE}${value}`;return `${API_BASE}/uploads/${value}`}
function imageBlock(title,value){const url=getFileUrl(value);if(!url){return `<div class="image-box"><h3>${title}</h3><div class="no-file">No file uploaded</div></div>`}const lower=url.toLowerCase();if(lower.endsWith(".pdf")){return `<div class="image-box"><h3>${title}</h3><a class="file-link" href="${url}" target="_blank">Open PDF Certificate</a></div>`}return `<div class="image-box" onclick="openImage('${url}')"><h3>${title}</h3><img src="${url}" alt="${title}"></div>`}
function openImage(src){document.getElementById("modalImage").src=src;document.getElementById("imageModal").style.display="flex"}
function closeImageModal(){document.getElementById("modalImage").src="";document.getElementById("imageModal").style.display="none"}
async function checkAdminSession(){try{const res=await fetch(`${API_BASE}/api/admin/check-session`,{credentials:"include"});const data=await res.json();if(!data.success||!data.user||!["admin","vendor"].includes(data.user.role)){localStorage.removeItem("didwapaAdmin");localStorage.removeItem("didwapaVendor");window.location.href="login.html"}}catch(err){localStorage.removeItem("didwapaAdmin");localStorage.removeItem("didwapaVendor");window.location.href="login.html"}}
async function loadUser(){if(!userId){userDetails.innerHTML="No user ID found.";return}try{const res=await fetch(`${API_BASE}/api/admin/users/${userId}`,{credentials:"include"});const data=await res.json();if(!data.success){userDetails.innerHTML=data.message||"Failed to load user.";return}const user=data.user;userDetails.classList.remove("loading");
const known=["id","firstname","lastname","email","gender","dob","telephone","other_telephone","role","status","created_at","updated_at","verification_other_tel","digital_address","address","alt_number","alt_number_name","selfie_image","gh_card_front","gh_card_back","business_name","business_type","business_category","business_whatsapp","business_email","business_region","business_district","business_registration_number","business_tin","business_website","business_hours","delivery_available","delivery_coverage","business_address","business_description","business_logo","business_registration_cert","pin_hash","password","confirm_password","verification_status"];
userDetails.innerHTML=`
<div class="section-title">Account Information</div><div class="grid">${detail("ID",user.id)}${detail("Role",user.role)}${statusDetail("Status",user.status)}${detail("Created At",formatDate(user.created_at))}${detail("Updated At",formatDate(user.updated_at))}${detail("Verification Other Tel",user.verification_other_tel)}</div>
<div class="section-title">Personal Information</div><div class="grid">${detail("Firstname",user.firstname)}${detail("Lastname",user.lastname)}${detail("Email",user.email)}${detail("Gender",user.gender)}${detail("Date of Birth",user.dob?String(user.dob).split("T")[0]:"")}${detail("Telephone",user.telephone)}${detail("Other Telephone",user.other_telephone)}${detail("Alternative Number",user.alt_number)}${detail("Alternative Number Name",user.alt_number_name)}</div>
<div class="section-title">Address Information</div><div class="grid">${detail("Digital Address",user.digital_address)}${detail("Address / Area",user.address,true)}</div>
<div class="section-title">Identity Files</div><div class="image-grid">${imageBlock("Selfie Image",user.selfie_image)}${imageBlock("Ghana Card Front",user.gh_card_front)}${imageBlock("Ghana Card Back",user.gh_card_back)}</div>
<div class="section-title">Business Information</div><div class="grid">${detail("Business Name",user.business_name)}${detail("Business Type",user.business_type)}${detail("Business Category",user.business_category)}${detail("Business WhatsApp",user.business_whatsapp)}${detail("Business Email",user.business_email)}${detail("Business Region",user.business_region)}${detail("Business District",user.business_district)}${detail("Business Registration Number",user.business_registration_number)}${detail("Business TIN",user.business_tin)}${detail("Business Website",user.business_website)}${detail("Business Hours",user.business_hours)}${detail("Delivery Available",user.delivery_available)}${detail("Delivery Coverage",user.delivery_coverage)}${detail("Business Address",user.business_address,true)}${detail("Business Description",user.business_description,true)}</div>
<div class="section-title">Business Files</div><div class="image-grid">${imageBlock("Business Logo",user.business_logo)}${imageBlock("Business Registration Certificate",user.business_registration_cert)}</div>
<div class="section-title">Other Saved Columns</div><div class="grid">${Object.keys(user).filter(key=>!known.includes(key)).map(key=>detail(key.replaceAll("_"," "),user[key])).join("")||detail("Extra Fields","No extra saved columns")}</div>`
}catch(err){console.error(err);userDetails.innerHTML="Failed to load user."}}
checkAdminSession();loadUser();
</script>
</body>
</html>
