<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA Admin - Disputes</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
:root{--dark:#06152f;--green:#20c463;--orange:#ff6600;--bg:#f4f7fb;--muted:#6b7280;--border:#e5e7eb}
body{background:var(--bg);color:var(--dark)}
.page{width:min(1180px,96%);margin:auto;padding:22px 0}
.top{background:white;border-radius:24px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 38px rgba(6,21,47,.08);margin-bottom:18px;animation:down .5s ease}
.brand{display:flex;gap:10px;align-items:center;font-weight:900}
.logo{width:42px;height:42px;border-radius:15px;background:var(--dark);color:var(--green);display:grid;place-items:center}
.back{background:var(--dark);color:white;text-decoration:none;padding:11px 15px;border-radius:14px;font-weight:900}
.header{background:linear-gradient(135deg,var(--dark),#0b244d);color:white;padding:28px;border-radius:28px;margin-bottom:18px;position:relative;overflow:hidden;animation:up .6s ease}
.header:after{content:"";position:absolute;width:210px;height:210px;background:rgba(32,196,99,.16);border-radius:50%;right:-70px;top:-80px}
.header h1{font-size:2.2rem;margin-bottom:8px}
.header p{color:#cbd5e1;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:white;border-radius:20px;padding:15px;box-shadow:0 14px 30px rgba(6,21,47,.07);animation:up .6s ease}
.stat small{color:var(--muted);font-weight:900}
.stat h2{margin-top:8px}
.controls{background:white;border-radius:22px;padding:14px;display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:16px;box-shadow:0 12px 26px rgba(6,21,47,.06)}
input,select,textarea{border:1px solid var(--border);border-radius:15px;padding:12px;background:#f8fafc;outline:none}
input,select{height:46px}
.disputes{display:grid;gap:14px}
.card{background:white;border:1px solid var(--border);border-radius:24px;padding:14px;display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;box-shadow:0 14px 30px rgba(6,21,47,.07);animation:up .6s ease;transition:.25s}
.card:hover{transform:translateY(-4px)}
.img{width:90px;height:90px;border-radius:18px;overflow:hidden;background:#f3f4f6}
.img img{width:100%;height:100%;object-fit:cover}
.info h3{font-size:1rem;margin-bottom:5px}
.info p{font-size:.75rem;color:var(--muted);margin:3px 0}
.reason{color:#111827!important;font-weight:700}
.amount{color:var(--orange);font-weight:900;margin-top:5px}
.right{text-align:right;display:grid;gap:8px;justify-items:end}
.status{display:inline-block;padding:7px 11px;border-radius:999px;font-size:.72rem;font-weight:900;text-transform:capitalize}
.open{background:#fee2e2;color:#b91c1c}
.reviewing{background:#dbeafe;color:#1d4ed8}
.resolved{background:#d1fae5;color:#047857}
.rejected{background:#f3f4f6;color:#374151}
.btn{border:none;background:var(--dark);color:white;padding:10px 13px;border-radius:13px;font-weight:900;cursor:pointer;font-size:.75rem}
.empty{background:white;padding:28px;text-align:center;border-radius:22px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}
.modal-card{width:100%;max-width:540px;background:white;border-radius:26px;padding:20px;box-shadow:0 25px 60px rgba(0,0,0,.25);animation:pop .3s ease}
.modal-card h2{margin-bottom:12px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.detail{background:#f8fafc;border-radius:15px;padding:12px}
.detail small{display:block;color:var(--muted);font-weight:900;margin-bottom:5px;font-size:.72rem}
.full{grid-column:1/-1}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.action-grid button{border:none;border-radius:14px;padding:11px;font-weight:900;color:white;cursor:pointer}
.o{background:#dc2626}.r{background:#2563eb}.s{background:#16a34a}.x{background:#6b7280}
.close{width:100%;margin-top:12px;background:var(--orange)}
@keyframes down{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.card{grid-template-columns:80px 1fr}.right{grid-column:1/-1;text-align:left;justify-items:start;display:flex;flex-wrap:wrap}}
@media(max-width:500px){.page{width:100%;padding:10px}.header h1{font-size:1.45rem}.stats{grid-template-columns:1fr}.card{grid-template-columns:1fr}.img{width:100%;height:190px}.detail-grid,.action-grid{grid-template-columns:1fr}.info p{font-size:.68rem}}
</style>
</head>

<body>

<div class="modal" id="modal">
  <div class="modal-card" id="modalContent"></div>
</div>

<div class="page">
  <div class="top">
    <div class="brand"><div class="logo">DW</div> Disputes Center</div>
    <a href="admin.html" class="back">← Dashboard</a>
  </div>

  <div class="header">
    <h1>Dispute Handling</h1>
    <p>Review buyer complaints, investigate product issues, and update dispute status professionally.</p>
  </div>

  <section class="stats">
    <div class="stat"><small>Total Disputes</small><h2 id="total">0</h2></div>
    <div class="stat"><small>Open</small><h2 id="open">0</h2></div>
    <div class="stat"><small>Reviewing</small><h2 id="reviewing">0</h2></div>
    <div class="stat"><small>Resolved</small><h2 id="resolved">0</h2></div>
  </section>

  <section class="controls">
    <input id="search" placeholder="Search buyer, product, phone, reason..." oninput="filterDisputes()">
    <select id="filter" onchange="filterDisputes()">
      <option value="">All Status</option>
      <option value="open">Open</option>
      <option value="reviewing">Reviewing</option>
      <option value="resolved">Resolved</option>
      <option value="rejected">Rejected</option>
    </select>
  </section>

  <section class="disputes" id="disputesBox">
    <div class="empty">Loading disputes...</div>
  </section>
</div>

<script>
 const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";
let disputes = [];
let selectedId = null;

function getFirstImage(images){
  try{
    const parsed = JSON.parse(images);
    if(Array.isArray(parsed) && parsed.length){
      let img = parsed[0].replace(/\\/g,"/");
      if(img.startsWith("http")) return img;
      if(img.startsWith("/")) return API_BASE + img;
      return API_BASE + "/" + img;
    }
    return "";
  }catch{return "";}
}

function statusClass(status){
  return String(status || "open").toLowerCase().replaceAll(" ","-");
}


async function checkAdminSession() {
  try {

    const res = await fetch(`${API_BASE}/api/admin/check-session`, {
      credentials: "include"
    });

    const data = await res.json();

    if (
      !data.success ||
      !data.user ||
      !["admin", "vendor"].includes(data.user.role)
    ) {

      localStorage.removeItem("didwapaAdmin");
      localStorage.removeItem("didwapaVendor");

      window.location.href = "login.html";
      return;
    }

  } catch (err) {

    localStorage.removeItem("didwapaAdmin");
    localStorage.removeItem("didwapaVendor");

    window.location.href = "login.html";
  }
}



async function loadDisputes(){
  try{
    const res = await fetch(`${API_BASE}/api/admin/disputes`, {
      credentials:"include"
    });

    const data = await res.json();

    if(!data.success){
      document.getElementById("disputesBox").innerHTML = `<div class="empty">${data.message}</div>`;
      return;
    }

    disputes = data.disputes;
    updateStats();
    renderDisputes(disputes);

  }catch(error){
    document.getElementById("disputesBox").innerHTML = `<div class="empty">Failed to load disputes.</div>`;
  }
}

function updateStats(){
  document.getElementById("total").textContent = disputes.length;
  document.getElementById("open").textContent = disputes.filter(d=>d.status==="open").length;
  document.getElementById("reviewing").textContent = disputes.filter(d=>d.status==="reviewing").length;
  document.getElementById("resolved").textContent = disputes.filter(d=>d.status==="resolved").length;
}

function renderDisputes(list){
  const box = document.getElementById("disputesBox");

  if(list.length === 0){
    box.innerHTML = `<div class="empty">No disputes found.</div>`;
    return;
  }

  box.innerHTML = list.map(d=>{
    const img = getFirstImage(d.images);

    return `
      <div class="card">
        <div class="img">
          ${img ? `<img src="${img}">` : `<img src="https://via.placeholder.com/300?text=No+Image">`}
        </div>

        <div class="info">
          <h3>${d.product_name || "Product"}</h3>
          <p>Buyer: ${d.buyer_name || "N/A"}</p>
          <p>Phone: ${d.buyer_phone || "N/A"}</p>
          <p class="reason">Reason: ${d.reason}</p>
          <div class="amount">Amount: GH₵${Number(d.total_amount || 0).toFixed(2)}</div>
        </div>

        <div class="right">
          <span class="status ${statusClass(d.status)}">${d.status}</span>
          <button class="btn" onclick="openModal(${d.id})">Handle</button>
        </div>
      </div>
    `;
  }).join("");
}

function filterDisputes(){
  const key = document.getElementById("search").value.toLowerCase();
  const status = document.getElementById("filter").value;

  const filtered = disputes.filter(d=>{
    const text = `
      ${d.product_name || ""}
      ${d.buyer_name || ""}
      ${d.buyer_phone || ""}
      ${d.reason || ""}
      ${d.status || ""}
    `.toLowerCase();

    return text.includes(key) && (!status || d.status === status);
  });

  renderDisputes(filtered);
}

function openModal(id){
  selectedId = id;
  const d = disputes.find(x => Number(x.id) === Number(id));
  if(!d) return;

  document.getElementById("modalContent").innerHTML = `
    <h2>${d.product_name}</h2>

    <div class="detail-grid">
      <div class="detail"><small>Buyer</small><strong>${d.buyer_name}</strong></div>
      <div class="detail"><small>Buyer Phone</small><strong>${d.buyer_phone}</strong></div>
      <div class="detail"><small>Seller ID</small><strong>${d.seller_id}</strong></div>
      <div class="detail"><small>Total Amount</small><strong>GH₵${Number(d.total_amount || 0).toFixed(2)}</strong></div>
      <div class="detail"><small>Order Status</small><strong>${d.order_status || "N/A"}</strong></div>
      <div class="detail"><small>Buyer Confirmation</small><strong>${d.buyer_confirm_status || "N/A"}</strong></div>
      <div class="detail full"><small>Reason</small><strong>${d.reason}</strong></div>
      <div class="detail full"><small>Admin Note</small><strong>${d.admin_note || "No note yet"}</strong></div>
    </div>

    <textarea id="adminNote" placeholder="Write admin note...">${d.admin_note || ""}</textarea>

    <div class="action-grid">
      <button class="o" onclick="updateDispute('open')">Open</button>
      <button class="r" onclick="updateDispute('reviewing')">Reviewing</button>
      <button class="s" onclick="updateDispute('resolved')">Resolved</button>
      <button class="x" onclick="updateDispute('rejected')">Reject</button>
    </div>

    <button class="btn close" onclick="closeModal()">Close</button>
  `;

  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

async function updateDispute(status){
  const adminNote = document.getElementById("adminNote").value.trim();

  const res = await fetch(`${API_BASE}/api/admin/disputes/${selectedId}/status`, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    credentials:"include",
    body:JSON.stringify({
      status,
      admin_note:adminNote
    })
  });

  const data = await res.json();
  alert(data.message);

  if(data.success){
    closeModal();
    loadDisputes();
  }
}

document.getElementById("modal").addEventListener("click", e=>{
  if(e.target.id === "modal") closeModal();
});

checkAdminSession();
loadDisputes();
</script>

</body>
</html>
