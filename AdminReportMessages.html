<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DIDWAPA Admin - Report Messages</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --primary: #20c463;
      --orange: #ff6600;
      --dark: #06152f;
      --bg: #f4f7fb;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    body {
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
    }

    .page {
      width: min(1200px, 96%);
      margin: auto;
      padding: 22px 0 35px;
    }

    .top-nav {
      background: white;
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 18px 38px rgba(6,21,47,.08);
      animation: slideDown .5s ease;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.1rem;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: var(--dark);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .back {
      text-decoration: none;
      background: var(--dark);
      color: white;
      padding: 11px 15px;
      border-radius: 14px;
      font-weight: 900;
      font-size: .85rem;
    }

    .header {
      background: linear-gradient(135deg, var(--dark), #0b244d);
      color: white;
      padding: 26px 28px;
      border-radius: 28px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 22px 48px rgba(6,21,47,.16);
      animation: fadeUp .6s ease;
    }

    .header::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: rgba(32,196,99,.16);
      right: -70px;
      top: -80px;
      animation: float 4s ease-in-out infinite;
    }

    .header h1 {
      position: relative;
      z-index: 2;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      margin-bottom: 8px;
    }

    .header p {
      position: relative;
      z-index: 2;
      color: #cbd5e1;
      line-height: 1.6;
      font-size: .95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      min-height: 640px;
    }

    .panel {
      background: white;
      border-radius: 26px;
      box-shadow: 0 18px 40px rgba(6,21,47,.08);
      overflow: hidden;
      animation: fadeUp .7s ease;
    }

    .panel-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 900;
    }

    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .search-box input {
      width: 100%;
      border: 1px solid var(--border);
      background: #f8fafc;
      height: 45px;
      border-radius: 15px;
      padding: 0 13px;
      outline: none;
      font-size: .9rem;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(32,196,99,.12);
    }

    .users-list {
      max-height: 540px;
      overflow-y: auto;
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .user-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      cursor: pointer;
      transition: .25s ease;
      background: #fff;
    }

    .user-card:hover,
    .user-card.active {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 12px 25px rgba(6,21,47,.08);
      background: #f7fff9;
    }

    .user-card strong {
      display: block;
      font-size: .95rem;
      margin-bottom: 5px;
    }

    .user-card span {
      display: block;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.4;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 640px;
    }

    .chat-user {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 17px;
      background: #dcfce7;
      color: #047857;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .chat-user h3 {
      font-size: 1rem;
      margin-bottom: 3px;
    }

    .chat-user p {
      color: var(--muted);
      font-size: .78rem;
    }

    .chat-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: linear-gradient(180deg, #f8fafc, #ffffff);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 72%;
      padding: 11px 13px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: .9rem;
      animation: pop .25s ease;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-start;
      background: #eef2ff;
      color: #111827;
      border-bottom-left-radius: 5px;
    }

    .message.admin {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .time {
      display: block;
      font-size: .65rem;
      opacity: .72;
      margin-top: 5px;
    }

    .reply-area {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: flex;
      gap: 10px;
      background: white;
    }

    .reply-area textarea {
      flex: 1;
      resize: none;
      height: 50px;
      max-height: 110px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 18px;
      padding: 13px;
      outline: none;
      font-size: .9rem;
    }

    .reply-area textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(32,196,99,.12);
    }

    .send-btn {
      width: 55px;
      height: 50px;
      border: none;
      border-radius: 17px;
      background: var(--dark);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: 900;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 15px;
      line-height: 1.6;
      font-size: .9rem;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(14px); }
    }

    @media(max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .users-list {
        max-height: 260px;
      }

      .chat-panel {
        min-height: 520px;
      }
    }

    @media(max-width: 480px) {
      .page {
        width: 100%;
        padding: 10px;
      }

      .top-nav,
      .header,
      .panel {
        border-radius: 20px;
      }

      .message {
        max-width: 86%;
        font-size: .82rem;
      }

      .reply-area textarea {
        font-size: .82rem;
      }

      .send-btn {
        width: 48px;
      }
    }

    .user-name-row {
  display: flex !important;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.report-count-badge {
  min-width: 24px;
  height: 24px;
  padding: 0 7px;
  border-radius: 999px;
  background: #ef4444;
  color: white;
  font-size: 12px;
  font-weight: 900;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
  </style>
</head>

<body>

<div class="page">

  <div class="top-nav">
    <div class="brand">
      <div class="brand-badge">DW</div>
      Report Messages
    </div>

    <a href="admin.html" class="back">← Dashboard</a>
  </div>

  <div class="header">
    <h1>User Report Center</h1>
    <p>View complaints, support requests, and reply users directly from the admin dashboard.</p>
  </div>

  <section class="layout">

    <aside class="panel">
      <div class="panel-head">Users With Reports</div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search user..." oninput="filterUsers()">
      </div>

      <div class="users-list" id="usersList">
        <div class="empty">Loading users...</div>
      </div>
    </aside>

    <section class="panel chat-panel">
      <div class="chat-user" id="chatUser">
        <div class="avatar">?</div>
        <div>
          <h3>Select a user</h3>
          <p>Choose a user from the left to view messages.</p>
        </div>
      </div>

      <div class="chat-area" id="chatArea">
        <div class="empty">No conversation selected.</div>
      </div>

      <div class="reply-area">
        <textarea id="replyInput" placeholder="Type admin reply..."></textarea>
        <button class="send-btn" onclick="sendReply()">➤</button>
      </div>
    </section>

  </section>

</div>

<script>
  const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";

  const usersList = document.getElementById("usersList");
  const chatArea = document.getElementById("chatArea");
  const chatUser = document.getElementById("chatUser");
  const replyInput = document.getElementById("replyInput");

  let allUsers = [];
  let selectedUserId = null;

  function formatTime(dateText) {
    if (!dateText) return "";
    return new Date(dateText).toLocaleString();
  }


async function checkAdminSession() {
  try {

    const res = await fetch(`${API_BASE}/api/admin/check-session`, {
      credentials: "include"
    });

    const data = await res.json();

    if (
      !data.success ||
      !data.user ||
      !["admin", "vendor"].includes(data.user.role)
    ) {

      localStorage.removeItem("didwapaAdmin");
      localStorage.removeItem("didwapaVendor");

      window.location.href = "login.html";
      return;
    }

  } catch (err) {

    localStorage.removeItem("didwapaAdmin");
    localStorage.removeItem("didwapaVendor");

    window.location.href = "login.html";
  }
}



  async function loadUsers() {
    try {
      const res = await fetch(`${API_BASE}/api/admin/report-users`, {
        credentials: "include"
      });

      const data = await res.json();

      if (!data.success) {
        usersList.innerHTML = `<div class="empty">${data.message}</div>`;
        return;
      }

      allUsers = data.users;
      renderUsers(allUsers);

    } catch (error) {
      usersList.innerHTML = `<div class="empty">Failed to load users.</div>`;
    }
  }

  function renderUsers(users) {
    if (users.length === 0) {
      usersList.innerHTML = `<div class="empty">No report messages yet.</div>`;
      return;
    }

    usersList.innerHTML = users.map(user => `
      <div class="user-card ${selectedUserId == user.user_id ? "active" : ""}" onclick="selectUser(${user.user_id})">
       <strong class="user-name-row">
  <span>${user.firstname || "Unknown"} ${user.lastname || ""}</span>
  ${
    Number(user.unread_count) > 0
      ? `<span class="report-count-badge">${user.unread_count}</span>`
      : ``
  }
</strong>
        <span>${user.email || "No email"}</span>
        <span>${user.telephone || "No telephone"}</span>
        <span>${user.total_messages} message(s)</span>
      </div>
    `).join("");
  }

  function filterUsers() {
    const keyword = document.getElementById("searchInput").value.toLowerCase();

    const filtered = allUsers.filter(user => {
      const name = `${user.firstname || ""} ${user.lastname || ""}`.toLowerCase();
      const email = `${user.email || ""}`.toLowerCase();
      const telephone = `${user.telephone || ""}`.toLowerCase();

      return name.includes(keyword) || email.includes(keyword) || telephone.includes(keyword);
    });

    renderUsers(filtered);
  }

  async function selectUser(userId) {
    selectedUserId = userId;

    const user = allUsers.find(u => Number(u.user_id) === Number(userId));

    chatUser.innerHTML = `
      <div class="avatar">${user?.firstname ? user.firstname.charAt(0).toUpperCase() : "U"}</div>
      <div>
        <h3>${user?.firstname || "Unknown"} ${user?.lastname || ""}</h3>
        <p>${user?.email || ""} ${user?.telephone ? " | " + user.telephone : ""}</p>
      </div>
    `;

    renderUsers(allUsers);
    loadMessages();
  }

  async function loadMessages() {
    if (!selectedUserId) return;

    try {
      const res = await fetch(`${API_BASE}/api/admin/report-messages/${selectedUserId}`, {
        credentials: "include"
      });

      const data = await res.json();

      if (!data.success) {
        chatArea.innerHTML = `<div class="empty">${data.message}</div>`;
        return;
      }

      if (data.messages.length === 0) {
        chatArea.innerHTML = `<div class="empty">No messages yet.</div>`;
        return;
      }

      chatArea.innerHTML = data.messages.map(msg => `
        <div class="message ${msg.sender === "admin" ? "admin" : "user"}">
          ${msg.message}
          <span class="time">${formatTime(msg.created_at)}</span>
        </div>
      `).join("");

      chatArea.scrollTop = chatArea.scrollHeight;

      await markSelectedUserReportsAsRead();
loadUsers();

    } catch (error) {
      chatArea.innerHTML = `<div class="empty">Failed to load messages.</div>`;
    }
  }

  async function sendReply() {
    const message = replyInput.value.trim();

    if (!selectedUserId) {
      alert("Select a user first.");
      return;
    }

    if (!message) return;

    try {
      const res = await fetch(`${API_BASE}/api/admin/report-reply`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({
          user_id: selectedUserId,
          message
        })
      });

      const data = await res.json();

      if (!data.success) {
        alert(data.message);
        return;
      }

      replyInput.value = "";
      loadMessages();
      loadUsers();

    } catch (error) {
      alert("Failed to send reply.");
    }
  }

  replyInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendReply();
    }
  });

async function markSelectedUserReportsAsRead() {
  if (!selectedUserId) return;

  try {
    const res = await fetch(`${API_BASE}/api/admin/report-messages/mark-read/${selectedUserId}`, {
      method: "POST",
      credentials: "include"
    });

    const data = await res.json();
    console.log("Admin mark user reports read:", data);
  } catch (error) {
    console.error("Admin mark reports read error:", error);
  }
}


  loadUsers();

  setInterval(() => {
    if (selectedUserId) {
      loadMessages();
    }


    checkAdminSession();
loadUsers();
  }, 5000);
</script>

</body>
</html>
