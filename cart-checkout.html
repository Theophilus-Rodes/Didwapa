<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA - Cart Checkout</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f4f7fb;color:#06152f}
.app{max-width:700px;margin:auto;min-height:100vh;background:white}
.header{background:linear-gradient(135deg,#143b86,#ff5a00);color:white;padding:30px 22px 65px;border-bottom-left-radius:32px;border-bottom-right-radius:32px}
.top{display:flex;justify-content:space-between;align-items:center}
.back{background:rgba(255,255,255,.2);color:white;border:none;padding:11px 18px;border-radius:999px;font-weight:900;cursor:pointer}
.header h1{margin-top:30px;font-size:30px}
.header p{margin-top:8px;opacity:.9}
.content{padding:18px;margin-top:-42px}
.card{background:white;padding:22px;border-radius:26px;box-shadow:0 25px 55px rgba(6,21,47,.12)}
.summary{background:#fff7ed;border:1px dashed #fdba74;color:#92400e;padding:15px;border-radius:18px;margin-bottom:18px;line-height:1.7}
label{display:block;font-weight:900;margin:14px 0 8px}
input,select{width:100%;height:55px;border:1px solid #e5e7eb;border-radius:17px;background:#f8fafc;padding:0 15px;font-size:16px}
button{width:100%;height:56px;border:none;border-radius:18px;background:linear-gradient(135deg,#ff6a00,#ff3d00);color:white;font-weight:900;font-size:16px;margin-top:18px;cursor:pointer}
.msg{text-align:center;font-weight:900;margin-top:12px}
</style>
</head>
<body>

<main class="app">
  <section class="header">
    <div class="top">
      <h3>Checkout</h3>
      <button class="back" onclick="history.back()">← Back</button>
    </div>

    <h1>Cart Payment</h1>
    <p>Pay for all items in your cart using mobile money.</p>
  </section>

  <section class="content">
    <div class="card">
      <div class="summary">
        <div>Total Items: <strong id="totalItems">0</strong></div>
        <div>Total Amount: <strong id="totalAmount">GH₵0.00</strong></div>
      </div>

      <label>MoMo Number</label>
      <input type="tel" id="momo_number" placeholder="Example: 0532687733">

      <label>Network</label>
      <select id="network">
        <option value="">Select network</option>
        <option value="MTN">MTN</option>
        <option value="Telecel">Telecel</option>
        <option value="AirtelTigo">AirtelTigo</option>
      </select>

      <label>Account Name</label>
      <input type="text" id="account_name" placeholder="Enter MoMo account name">

      <button id="payBtn" onclick="startCartPayment()">Pay Now</button>
      <div class="msg" id="msg"></div>
    </div>
  </section>
</main>

<script>
const API_BASE = `http://${window.location.hostname}:5000`;
const msg = document.getElementById("msg");
const payBtn = document.getElementById("payBtn");

async function loadSummary(){
  const res = await fetch(`${API_BASE}/api/cart/my-cart`, {
    credentials:"include"
  });

  const data = await res.json();

  if(!data.success){
    window.location.href = "userlogin.html";
    return;
  }

  const items = data.cart || [];
  const total = items.reduce((sum,item)=> sum + (Number(item.price) * Number(item.quantity)), 0);

  document.getElementById("totalItems").textContent = items.length;
  document.getElementById("totalAmount").textContent = `GH₵${total.toFixed(2)}`;

  if(items.length === 0){
    msg.textContent = "Your cart is empty.";
    msg.style.color = "red";
    payBtn.disabled = true;
  }
}

async function startCartPayment(){
  const momo_number = document.getElementById("momo_number").value.trim();
  const network = document.getElementById("network").value;
  const account_name = document.getElementById("account_name").value.trim();

  if(!momo_number || !network || !account_name){
    msg.textContent = "Please fill all payment details.";
    msg.style.color = "red";
    return;
  }

  payBtn.disabled = true;
  payBtn.textContent = "Sending prompt...";
  msg.textContent = "Please wait...";
  msg.style.color = "#06152f";

  try{
    const res = await fetch(`${API_BASE}/api/cart/momo/initiate`, {
      method:"POST",
      credentials:"include",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ momo_number, network, account_name })
    });

    const data = await res.json();

    if(!data.success){
      msg.textContent = data.message || "Could not start payment.";
      msg.style.color = "red";
      payBtn.disabled = false;
      payBtn.textContent = "Pay Now";
      return;
    }

    window.location.href = `cart-payment.html?reference=${data.reference}`;

  }catch(error){
    console.error(error);
    msg.textContent = "Payment request failed.";
    msg.style.color = "red";
    payBtn.disabled = false;
    payBtn.textContent = "Pay Now";
  }
}

loadSummary();
</script>

</body>
</html>
