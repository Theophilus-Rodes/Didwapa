<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA - Product Messages</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f6f7fb;color:#111827}
.app{max-width:620px;margin:auto;background:white;min-height:100vh}
.header{background:linear-gradient(135deg,#0a2d73,#ff6600);color:white;padding:22px 16px 42px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;animation:down .5s ease}
.top{display:flex;justify-content:space-between;align-items:center}
.back{border:none;background:rgba(255,255,255,.22);color:white;padding:10px 14px;border-radius:999px;font-weight:900}
.header h1{margin-top:18px;font-size:1.4rem}
.content{padding:16px;margin-top:-25px}
.chat-card{background:white;border:1px solid #e5e7eb;border-radius:22px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px;box-shadow:0 14px 30px rgba(0,0,0,.07);animation:up .5s ease;cursor:pointer}
.img{width:70px;height:70px;border-radius:16px;overflow:hidden;background:#f3f4f6}
.img img{width:100%;height:100%;object-fit:cover}
.info{flex:1}
.info h3{font-size:.98rem;margin-bottom:5px}
.info p{font-size:.78rem;color:#6b7280;margin-bottom:4px}
.badge{background:#fff1e6;color:#ff6600;padding:6px 10px;border-radius:999px;font-size:.72rem;font-weight:900}
.empty{background:white;padding:28px;text-align:center;border-radius:20px;color:#6b7280;box-shadow:0 12px 25px rgba(0,0,0,.06)}
@keyframes down{from{transform:translateY(-25px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes up{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:420px){.content{padding:12px}.chat-card{border-radius:18px}.img{width:58px;height:58px}.info h3{font-size:.85rem}.info p{font-size:.7rem}}
</style>
</head>

<body>

<main class="app">
  <section class="header">
    <div class="top">
      <h3>Product Messages</h3>
      <button class="back" onclick="goBackPage()">← Back</button>
    </div>
    <h1>Messages Inbox</h1>
  </section>

  <section class="content" id="inboxBox">
    <div class="empty">Loading messages...</div>
  </section>
</main>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";
const inboxBox = document.getElementById("inboxBox");

function getFirstImage(images){
  try{
    const parsed = JSON.parse(images);
    if(Array.isArray(parsed) && parsed.length > 0){
      let img = parsed[0].replace(/\\/g,"/");
      if(img.startsWith("http")) return img;
      if(img.startsWith("/")) return API_BASE + img;
      return API_BASE + "/" + img;
    }
    return "";
  }catch{
    return "";
  }
}

async function loadInbox(){
  try{
    const res = await fetch(`${API_BASE}/api/product-message/inbox`, {
      credentials:"include"
    });

    const data = await res.json();

    if(!data.success){
      window.location.href = "userlogin.html";
      return;
    }

    if(data.inbox.length === 0){
      inboxBox.innerHTML = `
        <div class="empty">
          No product messages yet.
        </div>
      `;
      return;
    }

    inboxBox.innerHTML = data.inbox.map(item => {
      const image = getFirstImage(item.images);

      return `
        <div class="chat-card" onclick="window.location.href='product-message.html?id=${item.product_id}&other_id=${item.other_user_id}'">
          <div class="img">
            ${
              image
              ? `<img src="${image}">`
              : `<img src="https://via.placeholder.com/100?text=No+Image">`
            }
          </div>

          <div class="info">
            <h3>${item.product_name || "Product"}</h3>
            <p>Chat with: ${item.firstname || "User"} ${item.lastname || ""}</p>
            <p>${item.telephone || ""}</p>
          </div>

          ${
  Number(item.unread_messages) > 0
    ? `<span class="badge">${item.unread_messages}</span>`
    : ``
}
        </div>
      `;
    }).join("");

  }catch(error){
    inboxBox.innerHTML = `
      <div class="empty">
        Failed to load messages.
      </div>
    `;
  }
}

loadInbox();
</script>

<script>


async function goBackPage() {
  try {
    const res = await fetch(`${API_BASE}/api/user/me`, {
      credentials: "include"
    });

    const data = await res.json();

    if (!data.success) {
      window.location.href = "login.html";
      return;
    }

    const role = data.user.role;

    if (role === "admin" || role === "vendor") {
      window.location.href = "AdminPostItem.html";
    } else {
      window.location.href = "you.html";
    }

  } catch (error) {
    console.error(error);
    window.location.href = "you.html";
  }
}
</script>

</body>
</html>
