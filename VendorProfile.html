<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIDWAPA Vendor Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      color: #0f172a;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #061326;
      color: white;
      padding: 35px 24px;
    }

    .logo {
      color: #22c55e;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .sidebar p {
      margin-bottom: 35px;
      opacity: 0.9;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 15px 16px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #22c55e;
    }

    .main {
      flex: 1;
      padding: 35px;
      overflow-x: hidden;
    }

    .top-card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .top-card h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .top-card p {
      color: #64748b;
    }

    .edit-btn {
      border: none;
      background: #16a34a;
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .profile-header {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white;
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: white;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      font-weight: 800;
      text-transform: capitalize;
    }

    .section-title {
      font-size: 23px;
      margin: 25px 0 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .info-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }

    .info-card span {
      display: block;
      color: #64748b;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .info-card strong {
      font-size: 17px;
      word-break: break-word;
    }

    .full {
      grid-column: 1 / -1;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .image-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }

    .image-card h3 {
      margin-bottom: 12px;
      font-size: 16px;
    }

    .image-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 15px;
      background: #e2e8f0;
    }

    .empty-img {
      height: 210px;
      border-radius: 15px;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-weight: 800;
      text-align: center;
      padding: 15px;
    }

    .loading {
      text-align: center;
      font-weight: 900;
      padding: 30px;
      color: #64748b;
    }

    @media(max-width: 900px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 24px;
      }

      .sidebar a {
        display: inline-block;
        margin-right: 8px;
      }

      .main {
        padding: 18px;
      }

      .top-card,
      .profile-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .grid,
      .image-grid {
        grid-template-columns: 1fr;
      }

      .edit-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">DIDWAPA</div>
    <p>Vendor Dashboard</p>

    <a href="vendordashboard.html">Dashboard</a>
    <a href="VendorProfile.html" class="active">Profile</a>
    <a href="#">My Products</a>
    <a href="#">Orders</a>
    <a href="#">Wallet</a>
    <a href="VendorVerify.html">Verify Account</a>
    <a href="#">Logout</a>
  </aside>

  <main class="main">
    <div class="top-card">
      <div>
        <h1>Vendor Profile</h1>
        <p>View your account and verification details.</p>
      </div>

      <a href="VendorVerify.html" class="edit-btn">Edit / Complete Verification</a>
    </div>

    <div id="profileContent" class="loading">Loading profile...</div>
  </main>
</div>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:5000"
    : `http://${window.location.hostname}:5000`;

const IMAGE_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:5000/uploads/"
    : `http://${window.location.hostname}:5000/uploads/`;

const profileContent = document.getElementById("profileContent");

function showValue(value) {
  return value && value !== "null" ? value : "Not provided";
}

function imageBlock(title, filename) {
  if (!filename) {
    return `
      <div class="image-card">
        <h3>${title}</h3>
        <div class="empty-img">No image uploaded</div>
      </div>
    `;
  }

  return `
    <div class="image-card">
      <h3>${title}</h3>
      <img src="${IMAGE_BASE + filename}" alt="${title}">
    </div>
  `;
}

async function loadProfile() {
  try {
    const res = await fetch(`${API_BASE}/api/vendor/profile`, {
      method: "GET",
      credentials: "include"
    });

    const data = await res.json();

    if (!data.success) {
      profileContent.innerHTML = `
        <div class="info-card">
          <strong>${data.message || "Failed to load profile."}</strong>
        </div>
      `;
      return;
    }

    const user = data.user;
    const initials = `${user.firstname?.charAt(0) || ""}${user.lastname?.charAt(0) || ""}`.toUpperCase();

    profileContent.classList.remove("loading");

    profileContent.innerHTML = `
      <div class="profile-header">
        <div>
          <h1>${showValue(user.firstname)} ${showValue(user.lastname)}</h1>
          <p>${showValue(user.email)}</p>
          <span class="badge">Account Status: ${showValue(user.status)}</span>
          <span class="badge">Verification: ${showValue(user.verification_status)}</span>
        </div>
        <div class="avatar">${initials || "V"}</div>
      </div>

      <h2 class="section-title">Basic Information</h2>
      <div class="grid">
        <div class="info-card">
          <span>User ID</span>
          <strong>${showValue(user.id)}</strong>
        </div>

        <div class="info-card">
          <span>Role</span>
          <strong>${showValue(user.role)}</strong>
        </div>

        <div class="info-card">
          <span>First Name</span>
          <strong>${showValue(user.firstname)}</strong>
        </div>

        <div class="info-card">
          <span>Last Name</span>
          <strong>${showValue(user.lastname)}</strong>
        </div>

        <div class="info-card">
          <span>Email</span>
          <strong>${showValue(user.email)}</strong>
        </div>

        <div class="info-card">
          <span>Gender</span>
          <strong>${showValue(user.gender)}</strong>
        </div>

        <div class="info-card">
          <span>Telephone</span>
          <strong>${showValue(user.telephone)}</strong>
        </div>

        <div class="info-card">
          <span>Other Telephone</span>
          <strong>${showValue(user.other_telephone)}</strong>
        </div>
      </div>

      <h2 class="section-title">Verification Details</h2>
      <div class="grid">
        <div class="info-card">
          <span>Other Verification Telephone</span>
          <strong>${showValue(user.verification_other_tel)}</strong>
        </div>

        <div class="info-card">
          <span>Digital Address</span>
          <strong>${showValue(user.digital_address)}</strong>
        </div>

        <div class="info-card">
          <span>Alternative Number</span>
          <strong>${showValue(user.alt_number)}</strong>
        </div>

        <div class="info-card">
          <span>Alternative Number Owner</span>
          <strong>${showValue(user.alt_number_name)}</strong>
        </div>

        <div class="info-card full">
          <span>Residential / Business Address</span>
          <strong>${showValue(user.address)}</strong>
        </div>

        <div class="info-card">
          <span>Verification Status</span>
          <strong>${showValue(user.verification_status)}</strong>
        </div>

        <div class="info-card">
          <span>Date Created</span>
          <strong>${showValue(user.created_at)}</strong>
        </div>
      </div>

      <h2 class="section-title">Uploaded Verification Images</h2>
      <div class="image-grid">
        ${imageBlock("Selfie Image", user.selfie_image)}
        ${imageBlock("Ghana Card Front", user.gh_card_front)}
        ${imageBlock("Ghana Card Back", user.gh_card_back)}
      </div>
    `;

  } catch (error) {
    console.error(error);
    profileContent.innerHTML = `
      <div class="info-card">
        <strong>Network error. Make sure backend is running.</strong>
      </div>
    `;
  }
}

loadProfile();
</script>

</body>
</html>
