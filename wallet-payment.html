<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA - Wallet Payment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f4f7fb;color:#06152f}
.wrapper{max-width:700px;margin:auto;min-height:100vh;background:white}
.hero{background:linear-gradient(135deg,#143b86,#ff5a00);color:white;padding:35px 28px 70px;border-bottom-left-radius:32px;border-bottom-right-radius:32px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.back{background:rgba(255,255,255,.2);color:white;text-decoration:none;padding:12px 20px;border-radius:24px;font-weight:900}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{font-size:16px;opacity:.95}
.card{background:white;margin:-42px 22px 0;padding:28px 22px;border-radius:26px;text-align:center;box-shadow:0 25px 55px rgba(6,21,47,.12)}
.loader{width:65px;height:65px;border:7px solid #eee;border-top-color:#ff5a00;border-radius:50%;margin:10px auto 20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{border:1px dashed #ff9b5f;background:#fff8f3;color:#9a3b00;padding:16px;border-radius:18px;margin-bottom:20px;line-height:1.5}
.msg{font-weight:900;margin:16px 0;color:#06152f}
button{width:100%;height:56px;border:none;border-radius:18px;color:white;font-weight:900;font-size:16px;margin-top:12px;cursor:pointer}
.orange{background:linear-gradient(135deg,#ff6a00,#ff3d00)}
.blue{background:#143b86}
</style>
</head>
<body>

<div class="wrapper">
  <div class="hero">
    <div class="top">
      <h3>Wallet Payment</h3>
      <a href="my-wallet.html" class="back">← Back</a>
    </div>

    <h1>Approve Payment</h1>
    <p>Please check your phone and enter your MoMo PIN.</p>
  </div>

  <div class="card">
    <div class="notice">
      Do not close this page. After approving the prompt, the system will confirm and update your wallet.
    </div>

    <div class="loader"></div>

    <div class="msg" id="msg">Waiting for payment confirmation...</div>

    <button class="orange" onclick="checkPayment()">I have paid, check again</button>
    <button class="blue" onclick="window.location.href='my-wallet.html'">Back to Wallet</button>
  </div>
</div>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";
const reference = new URLSearchParams(window.location.search).get("reference");
const msg = document.getElementById("msg");

async function checkPayment(){
  if(!reference){
    msg.textContent = "Invalid payment reference.";
    msg.style.color = "red";
    return;
  }

  msg.textContent = "Checking payment status...";
  msg.style.color = "#06152f";

  try{
    const res = await fetch(`${API_BASE}/api/wallet/topup/check/${reference}`, {
      credentials:"include"
    });

    const data = await res.json();

    if(data.success && data.paid){
      msg.textContent = "Payment confirmed. Wallet updated successfully.";
      msg.style.color = "green";

      setTimeout(()=>{
        window.location.href = "my-wallet.html";
      }, 1800);

      return;
    }

    msg.textContent = data.message || "Payment not confirmed yet.";
    msg.style.color = "orange";

  }catch(error){
    msg.textContent = "Could not check payment now.";
    msg.style.color = "red";
  }
}

setTimeout(checkPayment, 3000);
setInterval(checkPayment, 10000);
</script>

</body>
</html>
