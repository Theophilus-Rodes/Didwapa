<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DIDWAPA Products</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --primary:#ff6600;
  --primary-dark:#e95600;
  --green:#16a34a;
  --bg:#f7f8fb;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --soft:#fff4ea;
}

body{
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
}

.app{
  max-width:1180px;
  margin:0 auto;
  background:#fff;
  min-height:100vh;
}

.header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:20;
  padding:14px;
  border-bottom:1px solid var(--border);
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.top-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.back{
  width:38px;
  height:38px;
  border-radius:50%;
  border:none;
  background:var(--soft);
  color:var(--primary);
  font-size:22px;
  font-weight:900;
  cursor:pointer;
}

.title-box{
  flex:1;
}

.title-box small{
  color:var(--muted);
  font-weight:700;
}

.title-box h2{
  font-size:1.25rem;
  margin-top:2px;
}

.search-box{
  height:46px;
  background:#f9fafb;
  border:1px solid var(--border);
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
}

.search-box input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  font-size:.9rem;
}

.search-box button{
  border:none;
  background:var(--primary);
  color:#fff;
  padding:9px 14px;
  border-radius:10px;
  font-weight:900;
  cursor:pointer;
}

.filter-note{
  padding:12px 14px;
  background:#fff7ed;
  color:#444;
  font-size:.85rem;
  border-bottom:1px solid #ffe0c7;
}

.products{
  padding:14px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.product-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.035);
  transition:.25s ease;
}

.product-card:hover{
  transform:translateY(-5px);
}

.product-img{
  height:160px;
  background:#f3f4f6;
  display:grid;
  place-items:center;
  font-size:3rem;
  position:relative;
  overflow:hidden;
}

.product-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.verified-badge{
  position:absolute;
  left:7px;
  bottom:7px;
  background:var(--green);
  color:#fff;
  border-radius:999px;
  padding:4px 7px;
  font-size:.68rem;
  font-weight:900;
}

.product-info{
  padding:10px;
}

.product-name{
  font-size:.92rem;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:7px;
}

.product-price{
  font-size:1rem;
  font-weight:900;
  margin-bottom:6px;
}

.product-meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:.75rem;
}

.empty{
  grid-column:1/-1;
  padding:30px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .app{
    max-width:480px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
  }

  .product-img{
    height:145px;
  }

  .product-name{
    font-size:.82rem;
  }

  .product-price{
    font-size:.9rem;
  }
}


.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  max-width:1180px;
  width:100%;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(5,1fr) 1.5fr;
  align-items:center;
  gap:4px;
  padding:8px 10px;
  z-index:120;
}

.nav-item{
  text-align:center;
  text-decoration:none;
  color:#111;
  font-size:.76rem;
  font-weight:800;
  position:relative;
}

.nav-item div{
  font-size:1.45rem;
  margin-bottom:3px;
}

.nav-item.active,
.nav-item:hover{
  color:var(--primary);
}

.badge{
  position:absolute;
  top:-3px;
  right:30%;
  background:var(--primary);
  color:#fff;
  font-size:.65rem;
  min-width:18px;
  height:18px;
  border-radius:999px;
  display:inline-grid;
  place-items:center;
  font-weight:900;
}

.sell-btn{
  background:var(--green);
  color:#fff;
  border-radius:999px;
  padding:14px 20px;
  text-decoration:none;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

@media(max-width:600px){
  .bottom-nav{
    grid-template-columns:repeat(5,1fr);
    padding:7px 4px;
  }

  .bottom-nav .sell-btn{
    position:fixed;
    right:12px;
    bottom:82px;
    padding:12px 18px;
    z-index:130;
  }
}

.brand-filter{
  padding:10px 14px;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.brand-filter select{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 12px;
  background:#fff;
  font-weight:800;
  outline:none;
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="top-row">
      <button class="back" onclick="history.back()">←</button>

      <div class="title-box">
        <small id="subTitle">Products</small>
        <h2 id="pageTitle">Loading...</h2>
      </div>
    </div>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search within this category...">
      <button onclick="searchProducts()">Search</button>
    </div>
  </header>

  <div class="filter-note" id="filterNote"></div>

  <div class="brand-filter">
  <select id="brandSelect" onchange="searchProducts()">
    <option value="">All Brands</option>
  </select>
</div>

  <section id="productsContainer" class="products">
    <div class="empty">Loading products...</div>
  </section>

</div>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";


function saveLocation(region, district){
  localStorage.setItem("didwapa_region", region || "All Ghana");
  localStorage.setItem("didwapa_district", district || "");
}

function getSavedRegion(){
  return localStorage.getItem("didwapa_region") || "All Ghana";
}

function getSavedDistrict(){
  return localStorage.getItem("didwapa_district") || "";
}


const params = new URLSearchParams(window.location.search);

const category = params.get("category") || "";
const subcategory = params.get("subcategory") || "";
const region = params.get("region") || getSavedRegion();
const district = params.get("district") || getSavedDistrict();

saveLocation(region, district);

const pageTitle = document.getElementById("pageTitle");
const subTitle = document.getElementById("subTitle");
const filterNote = document.getElementById("filterNote");
const productsContainer = document.getElementById("productsContainer");
const searchInput = document.getElementById("searchInput");
const brandSelect = document.getElementById("brandSelect");

const brandOptions = {
  "Phones & Tablets": [
    "Apple", "Samsung", "Tecno", "Infinix", "Itel", "Huawei",
    "Xiaomi", "Oppo", "Vivo", "Nokia", "Google Pixel", "Sony",
    "LG", "Motorola", "OnePlus"
  ],

  "Mobile Phones": [
    "Apple", "Samsung", "Tecno", "Infinix", "Itel", "Huawei",
    "Xiaomi", "Oppo", "Vivo", "Nokia", "Google Pixel"
  ],

  "Tablets": [
    "Apple", "Samsung", "Huawei", "Lenovo", "Amazon", "Microsoft",
    "Xiaomi", "Tecno", "Infinix"
  ],

  "Electronics": [
    "Samsung", "LG", "Sony", "Hisense", "TCL", "Nasco", "Binatone",
    "Philips", "Panasonic", "JBL", "Oraimo", "Lenovo", "HP", "Dell"
  ],

  "Home Appliances": [
    "Samsung", "LG", "Hisense", "Nasco", "Midea", "TCL", "Binatone",
    "Philips", "Panasonic", "Bruhm", "Haier Thermocool"
  ],

  "Fashion": [
    "Nike", "Adidas", "Puma", "Gucci", "Zara", "H&M", "Louis Vuitton",
    "Balenciaga", "Dior", "Prada"
  ],

  "Vehicles": [
    "Toyota", "Honda", "Hyundai", "Kia", "Nissan", "Mercedes-Benz",
    "BMW", "Ford", "Volkswagen", "Mazda", "Lexus"
  ]
};

function loadBrandOptions(){
  const key = subcategory || category;
  const brands = brandOptions[key] || brandOptions[category] || [];

  brandSelect.innerHTML = `<option value="">All Brands</option>`;

  brands.forEach(brand => {
    brandSelect.innerHTML += `
      <option value="${brand}">
        ${brand}
      </option>
    `;
  });

  if(brands.length === 0){
    document.querySelector(".brand-filter").style.display = "none";
  }
}

pageTitle.textContent = subcategory || category || "Products";
subTitle.textContent = category || "DIDWAPA Products";

filterNote.textContent =
  `${subcategory || category || "All Products"} ${
    region ? " • " + region : ""
  } ${
    district ? " • " + district : ""
  }`;

function getFirstImage(images){
  try{
    const parsed = JSON.parse(images);

    if(Array.isArray(parsed) && parsed.length > 0){
      let img = parsed[0].replace(/\\/g, "/");

      if(img.startsWith("http")){
        return img;
      }

      if(img.startsWith("/")){
        return `${API_BASE}${img}`;
      }

      return `${API_BASE}/${img}`;
    }

    return "";
  }catch{
    return "";
  }
}

async function loadProducts(extraSearch = ""){
  try{
    let url = `${API_BASE}/api/products`;
    const query = new URLSearchParams();

if(category){
  query.append("category", category);
}

if(subcategory){
  query.append("subcategory", subcategory);
}


if(region && region !== "All Ghana"){
  query.append("region", region);
}
   if(district && district !== "All Districts"){
  query.append("district", district);
}

const selectedBrand = brandSelect.value;

let finalSearch = extraSearch || "";

if(selectedBrand){
  finalSearch = finalSearch
    ? `${finalSearch} ${selectedBrand}`
    : selectedBrand;
}

if(finalSearch){
  query.set("search", finalSearch);
}
    if(query.toString()){
      url += `?${query.toString()}`;
    }

    const res = await fetch(url, {
      method:"GET",
      credentials:"include"
    });

    const data = await res.json();

    if(!data.success){
      productsContainer.innerHTML = `
        <div class="empty" style="color:red;">
          Failed to load products.
        </div>
      `;
      return;
    }

    if(!data.products || data.products.length === 0){
      productsContainer.innerHTML = `
        <div class="empty">
          No product found for this selection.
        </div>
      `;
      return;
    }

    productsContainer.innerHTML = data.products.map(product => {
      const firstImage = getFirstImage(product.images);

      return `
        <div class="product-card" onclick="openProduct(${product.id})">
          <div class="product-img">
            ${
              firstImage
                ? `<img src="${firstImage}" alt="${product.product_name || "Product"}">`
                : `<span>🛍️</span>`
            }

            <span class="verified-badge">✓ Verified</span>
          </div>

          <div class="product-info">
            <div class="product-name">
              ${product.product_name || "Product"}
            </div>

            <div class="product-price">
              GH₵${Number(product.price || 0).toFixed(2)}
            </div>

            <div class="product-meta">
              <span>${product.item_condition || "Good"}</span>
              <span>${product.region || "Ghana"}</span>
            </div>
          </div>
        </div>
      `;
    }).join("");

  }catch(error){
    console.error(error);

    productsContainer.innerHTML = `
      <div class="empty" style="color:red;">
        Failed to load products.
      </div>
    `;
  }
}

function searchProducts(){
  const text = searchInput.value.trim();

  productsContainer.innerHTML = `
    <div class="empty">
      Searching...
    </div>
  `;

  loadProducts(text);
}

searchInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    searchProducts();
  }
});

function openProduct(id){
  window.location.href = `product-details.html?id=${id}`;
}

loadBrandOptions();
loadProducts();

async function openYouPage(event){
  event.preventDefault();

  try{
    const res = await fetch(`${API_BASE}/api/check-user-login`, {
      credentials:"include"
    });

    const data = await res.json();

    window.location.href = data.loggedIn ? "you.html" : "userlogin.html";

  }catch(error){
    window.location.href = "userlogin.html";
  }
}

async function openMessagesPage(event){
  event.preventDefault();

  try{
    const res = await fetch(`${API_BASE}/api/check-user-login`, {
      credentials:"include"
    });

    const data = await res.json();

    window.location.href = data.loggedIn ? "product-messages.html" : "userlogin.html";

  }catch(error){
    window.location.href = "userlogin.html";
  }
}

async function openCartPage(event){
  event.preventDefault();

  try{
    const res = await fetch(`${API_BASE}/api/check-user-login`, {
      credentials:"include"
    });

    const data = await res.json();

    window.location.href = data.loggedIn ? "cart.html" : "userlogin.html";

  }catch(error){
    window.location.href = "userlogin.html";
  }
}

async function loadCartCount(){
  try{
    const badge = document.getElementById("cartCountBadge");
    if(!badge) return;

    const res = await fetch(`${API_BASE}/api/cart/count`, {
      credentials:"include"
    });

    const data = await res.json();

    if(data.success){
      badge.textContent = data.count || 0;
      badge.style.display = Number(data.count) > 0 ? "inline-grid" : "none";
    }
  }catch(error){
    console.error(error);
  }
}

loadCartCount();
</script>


<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <div>🏠</div>
    Home
  </a>

  <a href="index.html#categoryHead" class="nav-item active">
    <div>▦</div>
    Categories
  </a>

  <a href="#" class="nav-item" onclick="openYouPage(event)">
    <span class="badge">0</span>
    <div>👤</div>
    You
  </a>

  <a href="#" class="nav-item" onclick="openMessagesPage(event)">
    <div>💬</div>
    Message
  </a>

  <a href="#" class="nav-item" onclick="openCartPage(event)">
    <span class="badge" id="cartCountBadge">0</span>
    <div>🛒</div>
    Cart
  </a>

  <a href="sell-products.html" class="sell-btn">
    Sell →
  </a>
</nav>

</body>
</html>
