<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DIDWAPA - Sell Product</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    :root{
      --primary:#ff6600;
      --secondary:#0a2d73;
      --bg:#f6f7fb;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
    }

    body{
      background:var(--bg);
      color:var(--text);
      padding-bottom:120px;
    }

    .app{
      max-width:650px;
      margin:auto;
      background:white;
      min-height:100vh;
      overflow:hidden;
    }

    .header{
      background:linear-gradient(135deg,var(--secondary),var(--primary));
      color:white;
      padding:22px 16px 45px;
      border-bottom-left-radius:28px;
      border-bottom-right-radius:28px;
      animation:slideDown .6s ease;
    }

    .top-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .back-btn{
      border:none;
      background:rgba(255,255,255,.2);
      color:white;
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:900;
    }

    .header h1{
      margin-top:18px;
      font-size:1.5rem;
    }

    .header p{
      margin-top:8px;
      font-size:.88rem;
      opacity:.9;
      line-height:1.5;
    }

    .content{
      padding:16px;
      margin-top:-26px;
    }

    .card{
      background:white;
      border-radius:22px;
      padding:16px;
      box-shadow:0 16px 35px rgba(0,0,0,.08);
      border:1px solid var(--border);
      animation:fadeUp .6s ease both;
    }

    .card-title{
      font-size:1rem;
      font-weight:900;
      color:var(--secondary);
      margin-bottom:16px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .full{
      grid-column:1 / -1;
    }

    label{
      font-size:.8rem;
      font-weight:900;
      color:#374151;
    }

    input,
    textarea,
    select{
      width:100%;
      border:1px solid var(--border);
      background:#f9fafb;
      border-radius:15px;
      outline:none;
      transition:.25s ease;
      padding:13px;
      font-size:.9rem;
    }

    textarea{
      min-height:120px;
      resize:none;
    }

    input:focus,
    textarea:focus,
    select:focus{
      border-color:var(--primary);
      background:white;
      box-shadow:0 0 0 4px rgba(255,102,0,.12);
    }

    .upload-box{
      border:2px dashed #ffb27a;
      border-radius:18px;
      padding:20px;
      background:#fff7f1;
      text-align:center;
      transition:.3s ease;
      cursor:pointer;
      position:relative;
      overflow:hidden;
    }

    .upload-box:hover{
      transform:translateY(-3px);
      background:#fff2e7;
    }

    .upload-box input{
      display:none;
    }

    .upload-icon{
      font-size:2rem;
      margin-bottom:10px;
    }

    .upload-text{
      font-size:.88rem;
      color:#444;
      line-height:1.5;
    }

    .preview-grid{
      margin-top:16px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .preview-item{
      aspect-ratio:1/1;
      border-radius:16px;
      overflow:hidden;
      position:relative;
      animation:zoomIn .4s ease;
      box-shadow:0 10px 20px rgba(0,0,0,.08);
    }

    .preview-item img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .remove-img-btn{
      position:absolute;
      top:6px;
      right:6px;
      width:28px;
      height:28px;
      border:none;
      border-radius:50%;
      background:#ef4444;
      color:white;
      font-weight:900;
      cursor:pointer;
      font-size:1rem;
      box-shadow:0 6px 14px rgba(0,0,0,.25);
    }

    .preview-count{
      margin-top:10px;
      font-size:.82rem;
      color:var(--primary);
      font-weight:900;
    }

    .add-more-btn{
      width:100%;
      height:48px;
      border:none;
      border-radius:18px;
      margin-top:12px;
      background:linear-gradient(135deg,var(--secondary),#153f9a);
      color:white;
      font-weight:900;
      cursor:pointer;
      transition:.3s ease;
    }

    .submit-btn{
      width:100%;
      height:52px;
      border:none;
      border-radius:18px;
      margin-top:20px;
      background:linear-gradient(135deg,var(--primary),#ff4500);
      color:white;
      font-weight:900;
      font-size:1rem;
      cursor:pointer;
      transition:.3s ease;
    }

    .submit-btn:hover,
    .add-more-btn:hover{
      transform:translateY(-4px);
      box-shadow:0 15px 30px rgba(255,102,0,.3);
    }

    .alert{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      background:white;
      padding:14px 18px;
      border-radius:15px;
      box-shadow:0 15px 40px rgba(0,0,0,.15);
      z-index:999;
      display:none;
      font-weight:900;
    }

    .success{
      color:green;
    }

    .error{
      color:red;
    }

    @keyframes slideDown{
      from{
        transform:translateY(-30px);
        opacity:0;
      }
      to{
        transform:translateY(0);
        opacity:1;
      }
    }

    @keyframes fadeUp{
      from{
        transform:translateY(30px);
        opacity:0;
      }
      to{
        transform:translateY(0);
        opacity:1;
      }
    }

    @keyframes zoomIn{
      from{
        transform:scale(.85);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    @media(max-width:600px){
      .content{
        padding:12px;
      }

      .card{
        padding:13px;
        border-radius:18px;
      }

      .form-grid{
        grid-template-columns:1fr;
        gap:11px;
      }

      .preview-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .header{
        padding:18px 13px 38px;
      }

      .header h1{
        font-size:1.25rem;
      }

      input,
      textarea,
      select{
        padding:12px;
        font-size:.83rem;
      }

      .submit-btn{
        height:48px;
        font-size:.92rem;
      }
    }

    .submit-btn:disabled{
  opacity: .8;
  cursor: not-allowed;
}

.btn-spinner{
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,.4);
  border-top:3px solid white;
  border-radius:50%;
  display:inline-block;
  vertical-align:middle;
  margin-right:8px;
  animation:spin .8s linear infinite;
}
  </style>
</head>

<body>

<div class="alert" id="alertBox"></div>

<main class="app">

  <section class="header">
    <div class="top-row">
      <h3>Sell Product</h3>

      <button class="back-btn" onclick="window.location.href='you.html'">
        ← Back
      </button>
    </div>

    <h1>Upload Your Product</h1>

    <p>
      Add your product details and upload at least 5 clear images
      to increase trust and visibility.
    </p>
  </section>

  <section class="content">

    <form class="card" id="productForm">

      <div class="card-title">
        Product Information
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label>Category</label>
          <select id="category" required>
  <option value="">Select category</option>
  <option>Trending</option>
  <option>Vehicles</option>
  <option>Property</option>
  <option>Phones & Tablets</option>
  <option>Electronics</option>
  <option>Home, Furniture & Appliances</option>
  <option>Fashion</option>
  <option>Beauty & Personal Care</option>
  <option>Services</option>
  <option>Repair & Construction</option>
  <option>Commercial Equipment & Tools</option>
  <option>Leisure & Activities</option>
  <option>Babies & Kids</option>
  <option>Food, Agriculture & Farming</option>
  <option>Animals & Pets</option>
  <option>Jobs</option>
  <option>Seeking Work - CVs</option>
</select>
        </div>

        <div class="form-group">
  <label>Region</label>
  <select name="region" id="region" required>
    <option value="">Select region</option>
    <option value="All Ghana">All Ghana</option>
    <option value="Ashanti">Ashanti</option>
    <option value="Central Region">Central Region</option>
    <option value="Greater Accra">Greater Accra</option>
    <option value="Brong Ahafo">Brong Ahafo</option>
    <option value="Eastern Region">Eastern Region</option>
    <option value="Northern Region">Northern Region</option>
    <option value="Upper East Region">Upper East Region</option>
    <option value="Upper West Region">Upper West Region</option>
    <option value="Volta Region">Volta Region</option>
    <option value="Western Region">Western Region</option>
  </select>
</div>

<div class="form-group">
  <label>Area / District</label>
  <select name="district" id="district" required>
    <option value="">Select area</option>
  </select>
</div>

        <div class="form-group">
          <label>Product Type</label>
          <input type="text" id="product_type" placeholder="e.g. Phone, Dress" required>
        </div>

        <div class="form-group full">
          <label>Product Name</label>
          <input type="text" id="product_name" placeholder="Enter product name" required>
        </div>

        <div class="form-group">
          <label>Price (GH₵)</label>
          <input type="number" id="price" placeholder="Enter price" required>
        </div>

        <div class="form-group">
          <label>Quantity in Stock</label>
          <input type="number" id="quantity" placeholder="Enter quantity" required>
        </div>

        <div class="form-group">
          <label>Product Color</label>
          <input type="text" id="product_color" placeholder="e.g. Black, White" required>
        </div>

        <div class="form-group">
          <label>Item Condition</label>
          <select id="item_condition" required>
            <option value="">Select condition</option>
            <option>Brand New</option>
            <option>Used</option>
            <option>Refurbished</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Phone Number</label>
          <input type="text" id="phone_number" placeholder="Enter contact number" required>
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea id="description" placeholder="Describe your product in detail..." required></textarea>
        </div>

        <div class="form-group full">
          <label>Instructions</label>
          <textarea id="instructions" placeholder="Special delivery or usage instructions..."></textarea>
        </div>

        <div class="form-group full">
          <label>Upload Product Images (Minimum 5)</label>

          <div class="upload-box" id="uploadBox">
            <input type="file" id="images" accept="image/*" multiple>

            <div class="upload-icon">🖼️</div>

            <div class="upload-text">
              Tap to upload pictures from gallery
            </div>

            <div class="preview-count" id="previewCount">
              0 images selected
            </div>
          </div>

          <button type="button" class="add-more-btn" id="addMoreBtn">
            + Add More Pictures
          </button>

          <div class="preview-grid" id="previewGrid"></div>
        </div>

      </div>

      <button type="submit" class="submit-btn">
        Upload Product
      </button>

    </form>

  </section>

</main>

<script>
 const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";

const alertBox = document.getElementById("alertBox");
const imageInput = document.getElementById("images");
const previewGrid = document.getElementById("previewGrid");
const previewCount = document.getElementById("previewCount");
const uploadBox = document.getElementById("uploadBox");
const addMoreBtn = document.getElementById("addMoreBtn");

let selectedFiles = [];

function showAlert(message, type = "success"){
  alertBox.textContent = message;
  alertBox.className = `alert ${type}`;
  alertBox.style.display = "block";

  setTimeout(() => {
    alertBox.style.display = "none";
  }, 2500);
}

uploadBox.addEventListener("click", () => {
  imageInput.click();
});

addMoreBtn.addEventListener("click", () => {
  imageInput.click();
});

imageInput.addEventListener("change", () => {
  const newFiles = [...imageInput.files];

  newFiles.forEach(file => {
    if (!file.type.startsWith("image/")) {
      return;
    }

    selectedFiles.push(file);
  });

  renderPreviews();

  imageInput.value = "";
});

function renderPreviews(){
  previewGrid.innerHTML = "";

  previewCount.textContent = `${selectedFiles.length} image(s) selected`;

  selectedFiles.forEach((file, index) => {
    const reader = new FileReader();

    reader.onload = (e) => {
      const div = document.createElement("div");
      div.className = "preview-item";

      div.innerHTML = `
        <img src="${e.target.result}" alt="Product image">
        <button type="button" class="remove-img-btn" onclick="removeImage(${index})">×</button>
      `;

      previewGrid.appendChild(div);
    };

    reader.readAsDataURL(file);
  });
}

function removeImage(index){
  selectedFiles.splice(index, 1);
  renderPreviews();
}

document.getElementById("productForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const submitBtn = document.querySelector(".submit-btn");

  if(submitBtn.disabled) return;

  const files = selectedFiles;

  if(files.length < 5){
    showAlert("Please upload at least 5 images.", "error");
    return;
  }

  const formData = new FormData();

  formData.append("category", document.getElementById("category").value);
  formData.append("region", document.getElementById("region").value);
  formData.append("district", document.getElementById("district").value);
  formData.append("product_name", document.getElementById("product_name").value);
  formData.append("product_type", document.getElementById("product_type").value);
  formData.append("price", document.getElementById("price").value);
  formData.append("product_color", document.getElementById("product_color").value);
  formData.append("quantity_in_stock", document.getElementById("quantity").value);
  formData.append("phone_number", document.getElementById("phone_number").value);
  formData.append("instructions", document.getElementById("instructions").value);
  formData.append("description", document.getElementById("description").value);
  formData.append("item_condition", document.getElementById("item_condition").value);

  files.forEach(file => {
    formData.append("images", file);
  });

 submitBtn.disabled = true;
submitBtn.innerHTML = `
  <span class="btn-spinner"></span>
  Uploading Product...
`;

try{
    const res = await fetch(`${API_BASE}/api/products/upload`, {
      method:"POST",
      credentials:"include",
      body:formData
    });

    const data = await res.json();

    if(data.success){
      showAlert(data.message || "Product uploaded successfully.");

      document.getElementById("productForm").reset();

     selectedFiles = [];
previewGrid.innerHTML = "";
previewCount.textContent = "0 images selected";

submitBtn.disabled = false;
submitBtn.innerHTML = "Upload Product";
    }else{
      showAlert(data.message || "Upload failed.", "error");
      submitBtn.disabled = false;
submitBtn.innerHTML = "Upload Product";
    }

  }catch(error){
    console.error(error);
    showAlert("Upload failed. Try again.", "error");
    submitBtn.disabled = false;
submitBtn.innerHTML = "Upload Product";
  }
});


const regionSelect = document.getElementById("region");
const districtSelect = document.getElementById("district");

const regionAreas = {
  "Ashanti": [
    "Atwima Kwanwoma", "Atwima Nwabiagya", "Ejisu-Juaben Municipal",
    "Kumasi Metropolitan", "Kwabre", "OTHER", "Adansi North",
    "Adansi South", "Afigya-Kwabre", "Ahafo Ano North", "Ahafo Ano South",
    "Amansie Central", "Amansie West", "Asante Akim Central Municipal",
    "Asante Akim North", "Asante Akim South", "Asokore Mampong Municipal",
    "Atwima Mponua", "Bekwai Municipal", "Bosome Freho", "Bosomtwe",
    "Ejura/Sekyedumase", "Mampong Municipal", "Obuasi Municipal",
    "Offinso Municipal", "Offinso North", "Sekyere Afram Plains",
    "Sekyere Central", "Sekyere East", "Sekyere Kumawu", "Sekyere South"
  ],

  "Central Region": [
    "Awutu Senya East Municipal", "Cape Coast Metropolitan", "Effutu Municipal",
    "Gomoa East", "OTHER", "Abura/Asebu/Kwamankese", "Agona East",
    "Agona West Municipal", "Ajumako/Enyan/Essiam", "Asikuma/Odoben/Brakwa",
    "Assin North Municipal", "Assin South", "Awutu Senya West", "Ekumfi",
    "Gomoa West", "Komenda/Edina/Eguafo/Abirem Municipal",
    "Mfantsiman Municipal", "Potsin", "Twifo-Ati Morkwa",
    "Twifo/Heman/Lower Denkyira", "Upper Denkyira East", "Upper Denkyira West"
  ],

  "Greater Accra": [
    "Accra Metropolitan", "Achimota", "Adabraka", "Adenta",
    "Tema Metropolitan", "OTHER", "Abelemkpe", "Ablekuma", "Abofu",
    "Abokobi", "Abossey Okai", "Accra New Town", "Adjiriganor",
    "Agbogba", "Agbogbloshie", "Airport Residential Area", "Akweteyman",
    "Alajo", "Amrahia", "Anyaa", "Apenkwa", "Ashaiman Municipal",
    "Ashaley Botwe", "Ashomang Estate", "Asylum Down", "Avenor Area",
    "Awoshie", "Banana Inn", "Bubuashie", "BurmaCamp", "Cantonments",
    "Chorkor", "Circle", "Control", "Danfa", "Dansoman", "Darkuman",
    "Dodowa", "Dome", "Dworwulu", "Dzorwulu", "East Legon",
    "GaEast Municipal", "Ga South Municipal", "Ga West Municipal",
    "Gbawe", "Haatso", "James Town", "Kaneshie", "Kasoa", "Kokomlemle",
    "Korle Gonno", "Kotobabi", "Kwashieman", "Labadi", "Labone",
    "Lapaz", "Lartebiokorshie", "Lartebiokoshie", "Ledzokuku-Krowor",
    "Little Legon", "Madina", "Mamobi", "Mamprobi", "Mataheko",
    "McCarthy Hill", "Nii Boi Town", "Nima", "Ningo-Prampram",
    "North Industrial Area", "North Legon", "Nungua", "Odorkor",
    "Ofankor", "Okaishie", "Okponglo", "Old Ashomang", "Osu",
    "Oyarifa", "Oyibi", "Pokuase", "Ridge", "Roman Ridge",
    "SSNIT Flats", "Santa Maria", "Sege", "Sempe New Town",
    "South La", "Shiashie", "Sowutwuom", "Spintex", "Sukura",
    "Taifa-Burkina", "Tantra Hills", "Tesano", "Teshie", "Weija",
    "West Legon", "Zoti Area"
  ],

  "Brong Ahafo": [
    "Atebubu-Amantin", "Berekum Municipal", "Sunyani Municipal",
    "Techiman Municipal", "OTHER", "Asunafo North Municipal",
    "Asunafo South", "Asutifi North", "Asutifi South", "Banda",
    "Dormaa East", "Dormaa Municipal", "Dormaa West", "Jaman North",
    "Jaman South", "Kintampo North Municipal", "Kintampo South",
    "Nkoranza North", "Nkoranza South", "Pru", "Sene East",
    "Sene West", "Sunyani West", "Tain", "Tano North", "Tano South",
    "Techiman South", "Wenchi Municipal"
  ]
};

regionSelect.addEventListener("change", () => {
  const region = regionSelect.value;
  const areas = regionAreas[region] || [];

  districtSelect.innerHTML = `<option value="">Select area</option>`;

  areas.forEach(area => {
    const option = document.createElement("option");
    option.value = area;
    option.textContent = area;
    districtSelect.appendChild(option);
  });
});
</script>

</body>
</html>
