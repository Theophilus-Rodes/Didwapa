<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA - Load Wallet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f4f7fb;color:#06152f}
.wrapper{max-width:700px;margin:auto;min-height:100vh;background:white}
.hero{background:linear-gradient(135deg,#143b86,#ff5a00);color:white;padding:35px 28px 70px;border-bottom-left-radius:32px;border-bottom-right-radius:32px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.back{background:rgba(255,255,255,.2);color:white;text-decoration:none;padding:12px 20px;border-radius:24px;font-weight:900}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{font-size:16px;opacity:.95}
.card{background:white;margin:-42px 22px 0;padding:22px;border-radius:26px;box-shadow:0 25px 55px rgba(6,21,47,.12)}
.notice{border:1px dashed #ff9b5f;background:#fff8f3;color:#9a3b00;padding:16px;border-radius:18px;margin-bottom:22px;line-height:1.5}
label{display:block;font-weight:900;margin:16px 0 8px;font-size:17px}
input{width:100%;height:58px;border:1px solid #e5e7eb;border-radius:18px;background:#f8fafc;padding:0 18px;font-size:17px;outline:none}
input:focus{border-color:#ff5a00;box-shadow:0 0 0 4px rgba(255,90,0,.12)}
button{width:100%;height:58px;border:none;border-radius:18px;background:linear-gradient(135deg,#ff6a00,#ff3d00);color:white;font-size:17px;font-weight:900;margin-top:18px;cursor:pointer}
.msg{text-align:center;margin-top:14px;font-weight:900}
</style>
</head>
<body>

<div class="wrapper">
  <div class="hero">
    <div class="top">
      <h3>Load Wallet</h3>
      <a href="my-wallet.html" class="back">← Back</a>
    </div>

    <h1>Add Money To Wallet</h1>
    <p>Enter the amount and the number money should be deducted from.</p>
  </div>

  <div class="card">
    <div class="notice">
      After clicking Load Wallet, a payment prompt will be sent to the number. Enter your MoMo PIN to approve.
    </div>

    <label>Amount GH₵</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <label>Number To Deduct From</label>
    <input type="text" id="momo_number" placeholder="Example: 0532687733">

    <button onclick="startTopup()">Load Wallet</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";

async function startTopup(){
  const amount = document.getElementById("amount").value.trim();
  const momo_number = document.getElementById("momo_number").value.trim();
  const msg = document.getElementById("msg");

  if(!amount || Number(amount) <= 0){
    msg.textContent = "Please enter a valid amount.";
    msg.style.color = "red";
    return;
  }

  if(!momo_number || momo_number.length < 10){
    msg.textContent = "Please enter a valid MoMo number.";
    msg.style.color = "red";
    return;
  }

  msg.textContent = "Sending payment prompt...";
  msg.style.color = "#06152f";

  try{
    const res = await fetch(`${API_BASE}/api/wallet/topup/initiate`, {
      method:"POST",
      credentials:"include",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ amount, momo_number })
    });

    const data = await res.json();

    if(!data.success){
      msg.textContent = data.message;
      msg.style.color = "red";
      return;
    }

    window.location.href = `wallet-payment.html?reference=${data.reference}`;

  }catch(error){
    msg.textContent = "Failed to start payment.";
    msg.style.color = "red";
  }
}
</script>

</body>
</html>
