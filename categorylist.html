<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIDWAPA Category List</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --primary:#ff6600;
  --green:#16a34a;
  --bg:#f7f8fb;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --soft:#fff4ea;
}

body{
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
}

.app{
  max-width:480px;
  margin:0 auto;
  background:#fff;
  min-height:100vh;
}

.header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:20;
  padding:14px;
  border-bottom:1px solid var(--border);
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.top-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.back{
  width:38px;
  height:38px;
  border-radius:50%;
  border:none;
  background:var(--soft);
  color:var(--primary);
  font-size:22px;
  font-weight:900;
  cursor:pointer;
}

.title-box{
  flex:1;
}

.title-box small{
  color:var(--muted);
  font-weight:700;
}

.title-box h2{
  font-size:1.25rem;
  margin-top:2px;
}

.search-box{
  height:46px;
  background:#f9fafb;
  border:1px solid var(--border);
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
}

.search-box span{
  color:var(--primary);
  font-size:18px;
}

.search-box input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  font-size:.9rem;
}


.category-list{
  padding:14px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.cat-row{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 6px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.035);
}

.cat-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--soft);
  font-size:25px;
  margin:0 auto 7px;
}

.cat-info strong{
  display:block;
  font-size:.65rem;
  line-height:1.15;
}

.cat-info small,
.arrow{
  display:none;
}

.cat-info strong{
  display:block;
  font-size:.95rem;
  margin-bottom:3px;
}

.cat-info small{
  color:var(--muted);
  font-size:.75rem;
}

.arrow{
  color:var(--primary);
  font-size:22px;
  font-weight:900;
}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
}

.section-title{
  padding:8px 14px 0;
  font-size:1.1rem;
  font-weight:900;
}

.products{
  padding:14px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.product-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
}

.product-img{
  height:140px;
  background:#f3f4f6;
  position:relative;
}

.product-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.verified{
  position:absolute;
  left:7px;
  bottom:7px;
  background:var(--green);
  color:#fff;
  font-size:.7rem;
  font-weight:900;
  padding:4px 8px;
  border-radius:999px;
}

.product-info{
  padding:10px;
}

.product-name{
  font-weight:900;
  margin-bottom:6px;
}

.product-price{
  font-weight:900;
  color:#111;
}

.product-meta{
  margin-top:6px;
  display:flex;
  justify-content:space-between;
  font-size:.75rem;
  color:#666;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="top-row">
    <button class="back" onclick="history.back()">←</button>

    <div class="title-box">
      <small>DIDWAPA Marketplace</small>
      <h2>Browse Categories</h2>
    </div>
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input id="categorySearch" type="text" placeholder="Search category...">
  </div>
</header>

<section id="categoryList" class="category-list"></section>

<h3 class="section-title">🔥 Trending Products</h3>

<section
    id="productsContainer"
    class="products">
</section>

</div>

<script>
function getSavedRegion(){
  return localStorage.getItem("didwapa_region") || "All Ghana";
}

function getSavedDistrict(){
  return localStorage.getItem("didwapa_district") || "";
}

const categories = [
  {
    name:"Vehicles",
    icon:"🚗",
    desc:"Cars, buses, trucks and vehicle parts"
  },
  {
    name:"Property",
    icon:"🏠",
    desc:"Houses, land, shops and short lets"
  },
  {
    name:"Phones & Tablets",
    icon:"📱",
    desc:"Phones, tablets and accessories"
  },
  {
    name:"Electronics",
    icon:"💻",
    desc:"Laptops, headphones and gadgets"
  },
  {
    name:"Fashion",
    icon:"👗",
    desc:"Clothing, shoes, bags and beauty"
  },
  {
    name:"Home Appliances",
    icon:"📺",
    desc:"TVs, fridges, fans and appliances"
  },
  {
    name:"Services",
    icon:"🛠️",
    desc:"Skilled services and professional help"
  }
];

const categoryList = document.getElementById("categoryList");
const categorySearch = document.getElementById("categorySearch");

const API_BASE =
  location.hostname === "localhost" ||
  location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "";

const productsContainer =
  document.getElementById("productsContainer");

function renderCategories(items){
  if(items.length === 0){
    categoryList.innerHTML = `
      <div class="empty">No category found.</div>
    `;
    return;
  }

  categoryList.innerHTML = items.map((cat, index) => `
    <div class="cat-row" data-index="${index}">
      <div class="cat-icon">${cat.icon}</div>

      <div class="cat-info">
        <strong>${cat.name}</strong>
      </div>
    </div>
  `).join("");

  document.querySelectorAll(".cat-row").forEach(row => {
    row.addEventListener("click", function(){
      const cat = items[this.dataset.index];
      openCategory(cat.name);
    });
  });
}


function openCategory(category){
  const region = getSavedRegion();
  const district = getSavedDistrict();

  const url = new URL("categories.html", window.location.href);

  url.searchParams.set("category", category);

  if(region && region !== "All Ghana"){
    url.searchParams.set("region", region);
  }

  if(district){
    url.searchParams.set("district", district);
  }

  window.location.href = url.toString();
}

categorySearch.addEventListener("input", function(){
  const text = this.value.toLowerCase().trim();

  const filtered = categories.filter(cat =>
    cat.name.toLowerCase().includes(text) ||
    cat.desc.toLowerCase().includes(text)
  );

  renderCategories(filtered);
});


function firstImage(images){
  try{
    const arr = JSON.parse(images);

    if(arr.length){
      const img = arr[0];

      if(img.startsWith("http")) return img;

      return API_BASE + img;
    }
  }catch(e){}

  return "";
}

async function loadTrendingProducts(){

  try{

    const res = await fetch(
      `${API_BASE}/api/products`,
      {
        credentials:"include"
      }
    );

    const data = await res.json();

    if(!data.success){
      return;
    }

    productsContainer.innerHTML =
      data.products.slice(0,8).map(product=>{

        return `
        <div class="product-card"
             onclick="location.href='product-details.html?id=${product.id}'">

          <div class="product-img">

            ${
              firstImage(product.images)
              ? `<img src="${firstImage(product.images)}">`
              : ""
            }

            <div class="verified">
              ✓ Verified
            </div>

          </div>

          <div class="product-info">

            <div class="product-name">
              ${product.product_name}
            </div>

            <div class="product-price">
              GH₵${Number(product.price).toFixed(2)}
            </div>

            <div class="product-meta">
              <span>${product.item_condition}</span>
              <span>${product.region}</span>
            </div>

          </div>

        </div>
        `;

      }).join("");

  }catch(e){
    console.log(e);
  }

}

renderCategories(categories);
loadTrendingProducts();
</script>

</body>
</html>
