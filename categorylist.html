<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIDWAPA - Category List</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --primary: #ff6600;
      --green: #08b34f;
      --bg: #f4f7f9;
      --text: #111827;
      --muted: #7b8794;
      --border: #e5e7eb;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 82px;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: #fff;
      animation: pageIn .4s ease;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top-bar {
      background: var(--green);
      height: 84px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .search-box {
      flex: 1;
      height: 48px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,.12);
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text);
    }

    .search-box span {
      font-size: 23px;
      color: #607d8b;
    }

    .list {
      background: #fff;
    }

    .list-item {
      min-height: 86px;
      display: grid;
      grid-template-columns: 76px 1fr 28px;
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: .2s ease;
      animation: slideIn .35s ease both;
    }

    .list-item:active {
      background: #f1f5f9;
      transform: scale(.98);
    }

    .list-item:nth-child(2) { animation-delay: .04s; }
    .list-item:nth-child(3) { animation-delay: .08s; }
    .list-item:nth-child(4) { animation-delay: .12s; }
    .list-item:nth-child(5) { animation-delay: .16s; }
    .list-item:nth-child(6) { animation-delay: .20s; }
    .list-item:nth-child(7) { animation-delay: .24s; }
    .list-item:nth-child(8) { animation-delay: .28s; }
    .list-item:nth-child(9) { animation-delay: .32s; }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .thumb {
      width: 64px;
      height: 64px;
      background: #edf2f7;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 35px;
      overflow: hidden;
    }

    .item-title {
      font-size: 20px;
      font-weight: 500;
      color: #263238;
      line-height: 1.2;
    }

    .ads-count {
      margin-top: 5px;
      font-size: 17px;
      color: #7b8a97;
    }

    .arrow {
      color: #78909c;
      font-size: 34px;
      font-weight: 300;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 70px;
      background: #fff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 50;
      box-shadow: 0 -6px 20px rgba(0,0,0,.08);
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      padding-top: 7px;
      cursor: pointer;
      position: relative;
    }

    .nav-item span {
      display: block;
      font-size: 23px;
      margin-bottom: 4px;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--green);
    }

    .sell-icon {
      width: 25px;
      height: 25px;
      border: 2px solid #475569;
      color: #475569;
      border-radius: 4px;
      display: grid !important;
      place-items: center;
      margin: 0 auto 4px;
      font-size: 18px !important;
      font-weight: 900;
    }

    .badge {
      position: absolute;
      top: 4px;
      right: 20px;
      background: #ef4444;
      color: #fff;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 11px;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.6;
    }

    @media (max-width: 420px) {
      .top-bar {
        height: 78px;
        padding: 10px;
      }

      .search-box {
        height: 46px;
      }

      .list-item {
        min-height: 82px;

        padding: 9px 12px;
      }

      .thumb {
        width: 60px;
        height: 60px;
        font-size: 32px;
      }

      .item-title {
        font-size: 18px;
      }

      .ads-count {
        font-size: 15px;
      }

      .arrow {
        font-size: 30px;
      }
    }
  </style>
</head>

let currentList = categoryData[category] || [];

function renderList(list) {
  const categoryList = document.getElementById("categoryList");

  if (!list.length) {
    categoryList.innerHTML = `
      <div class="empty">
        No subcategories found for ${category}.
      </div>
    `;
    return;
  }

  categoryList.innerHTML = list.map(item => `
    <div class="list-item" onclick="openSubcategory('${item.name.replace(/'/g, "\\'")}')">
      <div class="thumb">${item.icon}</div>

      <div>
        <div class="item-title">${item.name}</div>
        <div class="ads-count">${item.ads ? item.ads + " ads" : ""}</div>
      </div>

      <div class="arrow">›</div>
    </div>
  `).join("");
}

function filterList() {
  const search = document.getElementById("searchInput").value.toLowerCase().trim();

  if (!search) {
    renderList(currentList);
    return;
  }

  const filtered = currentList.filter(item =>
    item.name.toLowerCase().includes(search)
  );

  renderList(filtered);
}

function openSubcategory(subcategory) {
  window.location.href =
    `index.html?category=${encodeURIComponent(category)}&subcategory=${encodeURIComponent(subcategory)}&region=${encodeURIComponent(region)}&district=${encodeURIComponent(district)}`;
}

renderList(currentList);
