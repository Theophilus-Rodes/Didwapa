<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDWAPA Admin - Security Watch</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
:root{
  --dark:#06152f;
  --dark2:#0b244d;
  --green:#20c463;
  --orange:#ff6600;
  --bg:#f4f7fb;
  --muted:#6b7280;
  --border:#e5e7eb;
}
body{background:var(--bg);color:var(--dark)}
.page{width:min(1180px,96%);margin:auto;padding:22px 0}

.top{
  background:white;
  border-radius:24px;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 18px 38px rgba(6,21,47,.08);
  margin-bottom:18px;
  animation:down .5s ease;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.logo{
  width:42px;height:42px;border-radius:15px;
  background:var(--dark);color:var(--green);
  display:grid;place-items:center;font-weight:900;
}
.back{
  background:var(--dark);
  color:white;
  text-decoration:none;
  padding:11px 15px;
  border-radius:14px;
  font-weight:900;
}

.header{
  background:linear-gradient(135deg,var(--dark),var(--dark2));
  color:white;
  padding:30px;
  border-radius:28px;
  margin-bottom:18px;
  animation:up .6s ease;
}
.header h1{font-size:2.2rem;margin-bottom:8px}
.header p{color:#cbd5e1;line-height:1.6}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:18px;
}
.stat{
  background:white;
  border-radius:22px;
  padding:18px;
  box-shadow:0 14px 30px rgba(6,21,47,.07);
  position:relative;
  overflow:hidden;
  animation:up .65s ease;
}
.stat::after{
  content:"";
  position:absolute;
  right:-25px;
  top:-25px;
  width:85px;
  height:85px;
  border-radius:50%;
  background:#e9f9ef;
}
.stat small{display:block;color:var(--muted);font-weight:900;margin-bottom:8px}
.stat h2{font-size:1.5rem;color:var(--dark)}
.stat.good h2{color:var(--green)}
.stat.warn h2{color:var(--orange)}
.stat.bad h2{color:#dc2626}

.controls{
  background:white;
  border-radius:22px;
  padding:14px;
  display:grid;
  grid-template-columns:1fr 180px;
  gap:12px;
  margin-bottom:16px;
  box-shadow:0 12px 26px rgba(6,21,47,.06);
  animation:up .7s ease;
}
input,select{
  height:46px;
  border:1px solid var(--border);
  border-radius:15px;
  padding:0 13px;
  background:#f8fafc;
  outline:none;
}
input:focus,select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 4px rgba(32,196,99,.12);
}

.list{display:grid;gap:14px}
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:16px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  box-shadow:0 14px 30px rgba(6,21,47,.07);
  animation:up .6s ease;
  transition:.25s;
}
.card:hover{transform:translateY(-4px)}
.card h3{font-size:1rem;margin-bottom:6px}
.card p{font-size:.82rem;color:var(--muted);margin:5px 0;line-height:1.5}
.badge{
  display:inline-block;
  padding:8px 12px;
  border-radius:999px;
  font-size:.75rem;
  font-weight:900;
  text-transform:capitalize;
}
.success{background:#d1fae5;color:#047857}
.failed{background:#fee2e2;color:#b91c1c}
.warning{background:#fef3c7;color:#b45309}
.empty{
  background:white;
  border-radius:22px;
  padding:28px;
  text-align:center;
  color:var(--muted);
}

@keyframes down{
  from{opacity:0;transform:translateY(-18px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes up{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:850px){
  .stats{grid-template-columns:1fr}
  .controls{grid-template-columns:1fr}
  .card{grid-template-columns:1fr}
}
@media(max-width:480px){
  .page{width:100%;padding:10px}
  .top,.header,.card{border-radius:20px}
  .header h1{font-size:1.45rem}
  .card h3{font-size:.9rem}
  .card p{font-size:.75rem}
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.chat-btn{
  background:linear-gradient(135deg,var(--green),#0ea95c);
  color:white;
  text-decoration:none;
  padding:14px 18px;
  border-radius:18px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:10px;
  transition:.25s ease;
  box-shadow:0 14px 28px rgba(32,196,99,.25);
  animation:up .7s ease;
}

.chat-btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 18px 35px rgba(32,196,99,.35);
}

@media(max-width:650px){

  .header-top{
    flex-direction:column;
  }

  .chat-btn{
    width:100%;
    justify-content:center;
  }
}
</style>
</head>

<body>

<div class="page">
  <div class="top">
    <div class="brand"><div class="logo">DW</div> Security Watch</div>
    <a href="admin.html" class="back">← Dashboard</a>
  </div>

 <div class="header">

  <div class="header-top">
    <div>
      <h1>Admin Security Watch</h1>
      <p>
        Monitor login attempts, account actions, vendor requests,
        and suspicious activities.
      </p>
    </div>

    <a href="AdminProductChats.html" class="chat-btn">
      💬 Product Chats
    </a>
  </div>

</div>

  <section class="stats">
    <div class="stat good"><small>Successful Actions</small><h2 id="successCount">0</h2></div>
    <div class="stat warn"><small>Warnings</small><h2 id="warningCount">0</h2></div>
    <div class="stat bad"><small>Failed Actions</small><h2 id="failedCount">0</h2></div>
  </section>

  <div class="controls">
    <input id="searchInput" placeholder="Search action, user, details..." oninput="filterLogs()">
    <select id="statusFilter" onchange="filterLogs()">
      <option value="">All Status</option>
      <option value="success">Success</option>
      <option value="failed">Failed</option>
      <option value="warning">Warning</option>
    </select>
  </div>

  <div class="list" id="logsBox">
    <div class="empty">Loading security logs...</div>
  </div>
</div>

<script>
const API_BASE = `http://${window.location.hostname}:5000`;
let logs = [];




async function checkAdminSession() {
  try {

    const res = await fetch(`${API_BASE}/api/admin/check-session`, {
      credentials: "include"
    });

    const data = await res.json();

    if (
      !data.success ||
      !data.user ||
      !["admin", "vendor"].includes(data.user.role)
    ) {

      localStorage.removeItem("didwapaAdmin");
      localStorage.removeItem("didwapaVendor");

      window.location.href = "login.html";
      return;
    }

  } catch (err) {

    localStorage.removeItem("didwapaAdmin");
    localStorage.removeItem("didwapaVendor");

    window.location.href = "login.html";
  }
}



async function loadLogs(){
  try{
    const res = await fetch(`${API_BASE}/api/admin/security-logs`, {
      credentials:"include"
    });

    const data = await res.json();

    if(!data.success){
      document.getElementById("logsBox").innerHTML = `<div class="empty">${data.message}</div>`;
      return;
    }

    logs = data.logs || [];

    document.getElementById("successCount").textContent =
      logs.filter(l => l.status === "success").length;

    document.getElementById("warningCount").textContent =
      logs.filter(l => l.status === "warning").length;

    document.getElementById("failedCount").textContent =
      logs.filter(l => l.status === "failed").length;

    renderLogs(logs);

  }catch(error){
    console.error(error);
    document.getElementById("logsBox").innerHTML =
      `<div class="empty">Failed to load security logs.</div>`;
  }
}

function renderLogs(list){
  const box = document.getElementById("logsBox");

  if(list.length === 0){
    box.innerHTML = `<div class="empty">No security logs found.</div>`;
    return;
  }

  box.innerHTML = list.map(log => {
    const status = log.status || "success";

    return `
      <div class="card">
        <div>
          <h3>${log.action}</h3>
          <p><strong>User:</strong> ${log.firstname || "Unknown"} ${log.lastname || ""} ${log.email ? `(${log.email})` : ""}</p>
          <p><strong>Details:</strong> ${log.details || "N/A"}</p>
          <p><strong>IP:</strong> ${log.ip_address || "N/A"}</p>
          <p><strong>Date:</strong> ${new Date(log.created_at).toLocaleString()}</p>
        </div>

        <div>
          <span class="badge ${status}">${status}</span>
        </div>
      </div>
    `;
  }).join("");
}

function filterLogs(){
  const key = document.getElementById("searchInput").value.toLowerCase();
  const status = document.getElementById("statusFilter").value;

  const filtered = logs.filter(log => {
    const text = `
      ${log.action || ""}
      ${log.details || ""}
      ${log.firstname || ""}
      ${log.lastname || ""}
      ${log.email || ""}
      ${log.ip_address || ""}
      ${log.status || ""}
    `.toLowerCase();

    return text.includes(key) && (!status || log.status === status);
  });

  renderLogs(filtered);
}

checkAdminSession();
loadLogs();
</script>

</body>
</html>
